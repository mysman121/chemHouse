</style></head><body><div id="app"></div><noscript><p>This study website needs JavaScript. Please enable it in your browser. 此学习网站需要启用 JavaScript。</p></noscript><script>(function chemistryApp(DATA){
"use strict";
const {LESSONS,UI,BOOKS,ELEMENTS}=DATA;
const $=id=>document.getElementById(id);
const esc=value=>String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let storageAvailable=true,edition="en",view="home",detail="",record={read:[],answers:{},notes:""};
const fallback=()=>({read:[],answers:{},notes:""});
const validIds=new Set(LESSONS.map(l=>l.id)),questionIds=new Set(LESSONS.flatMap(l=>l.questions.map(q=>q.id)));
function sanitiseRecord(raw){
  if(!raw||typeof raw!=="object")return fallback();
  const result=fallback();
  result.read=Array.isArray(raw.read)?[...new Set(raw.read.filter(id=>validIds.has(id)))]:[];
  result.notes=typeof raw.notes==="string"?raw.notes:"";
  if(raw.answers&&typeof raw.answers==="object")for(const lesson of LESSONS)for(const q of lesson.questions){
    const a=raw.answers[q.id];
    if(a&&Number.isInteger(a.choice)&&a.choice>=0&&a.choice<q.options.en.length)
      result.answers[q.id]={choice:a.choice,correct:a.choice===q.answer};
  }
  return result;
}
function readRecord(){
  try{record=sanitiseRecord(JSON.parse(localStorage.getItem("chemhouse-v1-"+edition)||"null"));}
  catch{record=fallback();storageAvailable=false;}
}
function save(){
  try{localStorage.setItem("chemhouse-v1-"+edition,JSON.stringify(record));return true;}
  catch{storageAvailable=false;return false;}
}
const t=key=>UI[edition][key];
const title=item=>item.title[edition];
const visibleLessons=()=>LESSONS.filter(l=>edition==="en"||l.book!=="eng");
const visibleBooks=()=>BOOKS.filter(b=>edition==="en"||b.id!=="eng");
const bookTitle=id=>{const b=BOOKS.find(x=>x.id===id);return b?b[edition]:"";};
const allQuestions=()=>visibleLessons().flatMap(l=>l.questions.map(q=>({...q,lesson:l})));
function nav(destination,topic=""){
  const next="#/"+edition+"/"+destination+(topic?"/"+encodeURIComponent(topic):"");
  if(location.hash===next)render();else location.hash=next;
}
function route(){
  const parts=location.hash.replace(/^#\/?/,"").split("/");
  let nextEdition=parts[0]==="zh"?"zh":"en";
  if(!parts[0]){
    try{nextEdition=localStorage.getItem("chemhouse-edition")==="zh"?"zh":"en";}catch{}
    const queryEdition=new URLSearchParams(location.search).get("edition");
    if(queryEdition==="zh-CN"||queryEdition==="zh_CN")nextEdition="zh";
    location.replace("#/"+nextEdition+"/home");return;
  }
  if(edition!==nextEdition||!document.documentElement.dataset.initialised){edition=nextEdition;readRecord();}
  document.documentElement.dataset.initialised="true";
  try{localStorage.setItem("chemhouse-edition",edition);}catch{}
  view=["home","learn","lesson","practice","tools","notes","about"].includes(parts[1])?parts[1]:"home";
  try{detail=decodeURIComponent(parts[2]||"");}catch{detail="";}
  if((view==="lesson"||view==="practice")&&detail&&!visibleLessons().some(l=>l.id===detail)){view="learn";detail="";}
  render();
  window.scrollTo({top:0,behavior:"instant"});
}
function btn(label,action,value="",kind=""){return `<button class="btn ${kind}" data-action="${action}" data-value="${esc(value)}">${esc(label)}</button>`;}
function courseCard(book){
 const ls=visibleLessons().filter(l=>l.book===book.id),done=ls.filter(l=>record.read.includes(l.id)).length;
 return `<article class="card"><div class="card-top"><span class="course-icon ${book.id==="eng"?"gold":""}">${book.icon}</span><span class="topic-badge">${esc(book.id==="eng"?t("engTag"):t("chemTag"))}</span></div><h3>${esc(book[edition])}</h3><p>${esc(t("moduleDesc")[book.id])}</p><div class="progress-line" role="progressbar" aria-label="${esc(book[edition])}" aria-valuemin="0" aria-valuemax="${ls.length}" aria-valuenow="${done}"><span style="width:${done/ls.length*100}%"></span></div><div class="card-foot"><span>${done}/${ls.length} ${esc(t("progress"))}</span><button class="text-btn" data-action="learn-book" data-value="${book.id}">${esc(t("continue"))} →</button></div></article>`;
}
function heroArt(){
return `<div class="hero-art" aria-hidden="true"><svg viewBox="0 0 360 260" fill="none"><circle cx="180" cy="124" r="104" fill="#e0e9d5"/><circle cx="180" cy="124" r="82" stroke="#adc19a" stroke-dasharray="4 7"/><path d="M137 48h64m-52 0v56l-56 96c-8 14 0 29 17 29h119c17 0 25-15 17-29l-56-96V48" stroke="#426d50" stroke-width="5" stroke-linecap="round"/><path d="m123 161-23 42c-4 8 0 18 12 18h116c12 0 17-10 12-18l-24-42c-27 15-63-12-93 0Z" fill="#a4ca65"/><path d="M124 161c27-14 64 13 92 0" stroke="#668f42" stroke-width="3"/><circle cx="157" cy="181" r="6" fill="#f3f8e4"/><circle cx="195" cy="198" r="9" fill="#d7eca9"/><circle cx="182" cy="136" r="5" fill="#719d4b"/><circle cx="166" cy="114" r="3" fill="#719d4b"/><circle cx="260" cy="64" r="26" fill="#fbfcf6"/><path d="M245 64h30m-15-15v30" stroke="#7f9c59" stroke-width="2"/><circle cx="79" cy="112" r="20" fill="#fbfcf6"/><circle cx="79" cy="112" r="6" fill="#759859"/><path d="m266 168 13 8m-13 17 13-8m-27-9v16" stroke="#7f9c59" stroke-width="3" stroke-linecap="round"/></svg><div class="floating-label">${esc(t("art"))}<strong>${esc(t("artStrong"))}</strong></div></div>`;
}
function home(){
 const qs=allQuestions(),answered=qs.filter(q=>record.answers[q.id]),correct=answered.filter(q=>record.answers[q.id].correct).length;
 const read=visibleLessons().filter(l=>record.read.includes(l.id)).length;
 return `<section class="hero"><div><span class="eyebrow">${esc(t("greeting"))}</span><h1>${t("hero")}</h1><p>${esc(t("intro"))}</p><div class="actions">${btn(t("start")+" →","go","learn")}${btn(t("quiz"),"go","practice","secondary")}</div></div>${heroArt()}</section><div class="stats"><article class="stat"><span class="eyebrow">${esc(t("lessons"))}</span><div class="value">${read}<span class="muted" style="font-size:1rem"> / ${visibleLessons().length}</span></div><p>${esc(t("starter"))}</p></article><article class="stat"><span class="eyebrow">${esc(t("answered"))}</span><div class="value">${answered.length}<span class="muted" style="font-size:1rem"> / ${qs.length}</span></div><p>${esc(t("unique"))}</p></article><article class="stat"><span class="eyebrow">${esc(t("accuracy"))}</span><div class="value">${answered.length?Math.round(correct/answered.length*100)+"%":"—"}</div><p>${esc(t("ready"))}</p></article></div><section><div class="section-head"><div><h2>${esc(t("paths"))}</h2></div><span class="pill"><span class="dot"></span>${esc(t("starter"))}</span></div><div class="grid">${visibleBooks().map(courseCard).join("")}</div></section><div class="split"><section class="feature"><span class="eyebrow">n = m/M</span><h3>${esc(t("tipTitle"))}</h3><p>${esc(t("tipDesc"))}</p>${btn(t("openTools")+" →","go","tools")}</section><section class="card"><span class="eyebrow muted">${esc(t("next"))}</span><h3>${esc(t("engTitle"))}</h3><p>${esc(t("engDesc"))}</p>${edition==="en"?btn(t("engCta")+" →","learn-book","eng","subtle"):btn(t("engCta")+" →","go","practice","subtle")}</section></div>`;
}
let libraryFilter="all",searchTerm="";
function lessonCards(){
 const term=searchTerm.trim().toLowerCase();
 const ls=visibleLessons().filter(l=>(libraryFilter==="all"||l.book===libraryFilter)&&(!term||[title(l),bookTitle(l.book),...l.points[edition]].join(" ").toLowerCase().includes(term)));
 return ls.length?ls.map(l=>`<article class="card"><div class="card-top"><span class="pill">${esc(l.book==="eng"?t("engTag"):t("chemTag"))}</span><span class="muted" style="font-size:.73rem">${esc(t("minutes"))}</span></div><h3>${esc(title(l))}</h3><p>${esc(l.points[edition][0])}</p><div class="card-foot"><span>${record.read.includes(l.id)?esc(t("completed")):esc(bookTitle(l.book))}</span><button class="text-btn" data-action="lesson" data-value="${l.id}">${esc(t("read"))} →</button></div></article>`).join(""):`<p class="empty">${esc(t("noResults"))}</p>`;
}
function learn(){
 if(!visibleBooks().some(b=>b.id===libraryFilter))libraryFilter="all";
 return `<div class="section-head"><div><span class="eyebrow muted">${esc(t("starter"))}</span><h1 style="font-size:2.4rem;margin:12px 0">${esc(t("learn"))}</h1><p class="muted">${esc(t("pathDesc"))}</p></div></div><div class="filter-bar"><input id="search" class="input" type="search" aria-label="${esc(t("searchLabel"))}" placeholder="${esc(t("search"))}" value="${esc(searchTerm)}"><select class="input" id="book-filter" aria-label="${esc(t("book"))}"><option value="all">${esc(t("all"))}</option>${visibleBooks().map(b=>`<option value="${b.id}" ${libraryFilter===b.id?"selected":""}>${esc(b[edition])}</option>`).join("")}</select></div><div id="lesson-cards" class="grid">${lessonCards()}</div>`;
}
function lesson(){
 const l=visibleLessons().find(x=>x.id===detail);
 if(!l)return learn();

function calculate(first,divisor){
 if(typeof first!=="string"||typeof divisor!=="string"||!first.trim()||!divisor.trim())return {error:"invalid"};
 const a=Number(first),b=Number(divisor);
 if(!Number.isFinite(a)||!Number.isFinite(b)||a<0||b<=0)return {error:"invalid"};
 const answer=a/b;
 if(!Number.isFinite(answer)||(a!==0&&answer===0))return {error:"range"};
 return {value:answer,display:answer===0?"0":Number(answer.toPrecision(6)).toString()};
}

 else if(action==="review"){

 }
 else if(action==="element"){

 else if(action==="export"){

   const url=URL.createObjectURL(new Blob(["\uFEFF"+text],{type:"text/plain;charset=utf-8"})),a=document.createElement("a");
   a.href=url;a.download="ChemHouse-"+(edition==="zh"?"zh-CN":"en")+"-notes.txt";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
 }

。"]},"example":{"en":"Using M(H₂O) ≈ 18.0 g·mol⁻¹, 9.0 g of water is 9.0/18.0 = 0.50 mol of H₂O molecules.","zh":"取 M(H₂O) ≈ 18.0 g·mol⁻¹，9.0 g 水的物质的量为 9.0/18.0 = 0.50 mol。"},"pitfall":{"en":"22.4 L·mol⁻¹ is an approximate gas molar volume at 0 °C and 101 kPa; do not apply it to liquids or arbitrary conditions.","zh":"22.4 L·mol⁻¹ 是标准状况下气体摩尔体积的近似值，不能直接用于液体或任意温压条件。"},"questions":[{"id":"moles-0","prompt":{"en":"How many moles are in 5.85 g NaCl? Use M = 58.5 g·mol⁻¹.","zh":"5.85 g NaCl 的物质的量是多少？取 M = 58.5 g·mol⁻¹。"},"options":{"en":["0.010 mol","0.100 mol","1.00 mol","10.0 mol"],"zh":["0.010 mol","0.100 mol","1.00 mol","10.0 mol"]},"answer":1,"explanation":{"en":"n = m/M = 5.85/58.5 = 0.100 mol.","zh":"n = m/M = 5.85/58.5 = 0.100 mol。"}},{"id":"moles-1","prompt":{"en":"0.20 mol solute is dissolved to make 500 mL solution. What is c?","zh":"将 0.20 mol 溶质配成 500 mL 溶液，物质的量浓度是多少？"},"options":{"en":["0.10 mol/L","0.20 mol/L","0.40 mol/L","100 mol/L"],"zh":["0.10 mol/L","0.20 mol/L","0.40 mol/L","100 mol/L"]},"answer":2,"explanation":{"en":"Convert 500 mL to 0.500 L. c = 0.20/0.500 = 0.40 mol/L.","zh":"500 mL = 0.500 L，c = 0.20/0.500 = 0.40 mol/L。"}}]},{"id":"redox","book":"c1","title":{"en":"Oxidation & reduction","zh":"氧化还原反应"},"points":{"en":["Oxidation is loss of electrons; reduction is gain of electrons.","Oxidation numbers rise in oxidation and fall in reduction.","The oxidising agent accepts electrons and is reduced. The reducing agent loses electrons and is oxidised."],"zh":["氧化是失电子的过程，还原是得电子的过程。","氧化反应中元素化合价升高，还原反应中元素化合价降低。","氧化剂得电子、被还原；还原剂失电子、被氧化。"]},"example":{"en":"In Zn + Cu²⁺ → Zn²⁺ + Cu, Zn loses 2 electrons and is the reducing agent. Cu²⁺ gains 2 electrons and is the oxidising agent.","zh":"在 Zn + Cu²⁺ → Zn²⁺ + Cu 中，Zn 失去 2 个电子，是还原剂；Cu²⁺ 得到 2 个电子，是氧化剂。"},"pitfall":{"en":"Oxidation does not have to involve oxygen. Distinguish the agent from the process it undergoes.","zh":"氧化反应不一定有氧参加。注意区分试剂的性质与其自身发生的变化。"},"questions":[{"id":"redox-0","prompt":{"en":"In Zn + Cu²⁺ → Zn²⁺ + Cu, which is the reducing agent?","zh":"在 Zn + Cu²⁺ → Zn²⁺ + Cu 中，还原剂是？"},"options":{"en":["Zn","Cu²⁺","Zn²⁺","Cu"],"zh":["Zn","Cu²⁺","Zn²⁺","Cu"]},"answer":0,"explanation":{"en":"Zn donates electrons and is oxidised; it reduces Cu²⁺.","zh":"Zn 失电子被氧化，使 Cu²⁺ 被还原，因此是还原剂。"}},{"id":"redox-1","prompt":{"en":"What is the oxidation number of S in H₂SO₄?","zh":"H₂SO₄ 中硫元素的化合价为？"},"options":{"en":["−2","+2","+4","+6"],"zh":["−2","+2","+4","+6"]},"answer":3,"explanation":{"en":"2(+1) + x + 4(−2) = 0, so x = +6.","zh":"2×(+1) + x + 4×(−2) = 0，得 x = +6。"}}]},{"id":"metals","book":"c1","title":{"en":"Metals & ionic equations","zh":"金属及离子反应"},"points":{"en":["More reactive metals can displace less reactive metals from suitable salt solutions.","In ionic equations, split soluble strong electrolytes in aqueous solution into ions; keep solids, gases, water and weak electrolytes intact.","Atoms and total charge must balance on both sides."],"zh":["较活泼金属可在适当条件下从盐溶液中置换出较不活泼金属。","书写离子方程式时，将水溶液中可溶性强电解质拆为离子；固体、气体、水和弱电解质保留化学式。","离子方程式必须同时满足原子守恒和电荷守恒。"]},"example":{"en":"Mixing BaCl₂(aq) and Na₂SO₄(aq) gives Ba²⁺ + SO₄²⁻ → BaSO₄(s). Na⁺ and Cl⁻ are spectator ions.","zh":"BaCl₂ 溶液与 Na₂SO₄ 溶液混合：Ba²⁺ + SO₄²⁻ → BaSO₄↓。Na⁺ 和 Cl⁻ 不参与净反应。"},"pitfall":{"en":"Sodium reacts with water in aqueous salt solutions; do not assume it simply displaces the dissolved metal.","zh":"钠在盐溶液中会先与水反应，不能简单套用金属置换规律。"},"questions":[{"id":"metals-0","prompt":{"en":"What is the net ionic equation for dilute HCl reacting with NaOH(aq)?","zh":"稀盐酸与 NaOH 溶液反应的离子方程式是？"},"options":{"en":["H⁺ + OH⁻ → H₂O","Na⁺ + Cl⁻ → NaCl","H₂ + O₂ → H₂O","H⁺ → H₂"],"zh":["H⁺ + OH⁻ → H₂O","Na⁺ + Cl⁻ → NaCl","H₂ + O₂ → H₂O","H⁺ → H₂"]},"answer":0,"explanation":{"en":"H⁺ and OH⁻ form water; the other dissolved ions are spectators.","zh":"H⁺ 与 OH⁻ 生成水，其他离子为旁观离子。"}},{"id":"metals-1","prompt":{"en":"Which pair produces a precipitate on mixing aqueous solutions?","zh":"下列两组离子在溶液中相遇，哪组会生成沉淀？"},"options":{"en":["Na⁺ and Cl⁻","K⁺ and NO₃⁻","Ba²⁺ and SO₄²⁻","H⁺ and Cl⁻"],"zh":["Na⁺ 与 Cl⁻","K⁺ 与 NO₃⁻","Ba²⁺ 与 SO₄²⁻","H⁺ 与 Cl⁻"]},"answer":2,"explanation":{"en":"Barium sulfate is insoluble in water.","zh":"BaSO₄ 难溶于水，生成白色沉淀。"}}]},{"id":"periodic","book":"c1","title":{"en":"Atomic structure & periodic trends","zh":"原子结构与元素周期律"},"points":{"en":["Atomic number equals proton number. A neutral atom has equal numbers of protons and electrons.","Isotopes have the same proton number but different neutron numbers.","Across a period, atomic radius generally decreases; down a main group, it generally increases."],"zh":["原子序数等于质子数。中性原子的电子数等于质子数。","同位素具有相同的质子数、不同的中子数。","同周期主族元素原子半径通常从左向右减小；同主族通常从上到下增大。"]},"example":{"en":"²³Na has 11 protons and 12 neutrons. Na⁺ has 10 electrons; forming the ion does not change its nucleus.","zh":"²³Na 含 11 个质子、12 个中子。Na⁺ 含 10 个电子，形成离子时原子核不变。"},"pitfall":{"en":"Mass number is protons + neutrons, not the relative atomic mass averaged across natural isotopes.","zh":"质量数等于质子数与中子数之和，不能与天然同位素平均得到的相对原子质量混同。"},"questions":[{"id":"periodic-0","prompt":{"en":"How many electrons are in Mg²⁺? Atomic number of Mg is 12.","zh":"Mg 的原子序数为 12，Mg²⁺ 中有多少个电子？"},"options":{"en":["10","12","14","24"],"zh":["10","12","14","24"]},"answer":0,"explanation":{"en":"The neutral atom has 12 electrons and loses 2 to form Mg²⁺.","zh":"中性 Mg 原子有 12 个电子，失去 2 个电子后剩下 10 个。"}},{"id":"periodic-1","prompt":{"en":"Isotopes of an element differ in their…","zh":"同种元素的不同同位素，其差异在于……"},"options":{"en":["Proton number","Neutron number","Atomic number","Element symbol"],"zh":["质子数","中子数","原子序数","元素符号"]},"answer":1,"explanation":{"en":"Proton number defines the element; isotopes differ in neutron number.","zh":"质子数决定元素种类，同位素的中子数不同。"}}]},{"id":"nonmetals","book":"c2","title":{"en":"Sulfur, nitrogen & their compounds","zh":"硫、氮及其化合物"},"points":{"en":["SO₂ is an acidic oxide. In water it participates in equilibria involving sulfurous acid species.","Nitrogen shows several oxidation states. NH₃ is basic in water; nitric acid is an oxidising acid.","Ammonium ions react with hydroxide on heating to release ammonia."],"zh":["SO₂ 属于酸性氧化物，溶于水后涉及亚硫酸及其相关微粒的平衡。","氮有多种化合价。氨溶于水呈碱性，硝酸具有氧化性。","铵根离子与氢氧根离子共热可放出氨气。"]},"example":{"en":"NH₄⁺ + OH⁻ → NH₃↑ + H₂O (on heating). Released ammonia turns moist red litmus paper blue.","zh":"NH₄⁺ + OH⁻ → NH₃↑ + H₂O（加热）。氨气可使湿润的红色石蕊试纸变蓝。"},"pitfall":{"en":"Nitric acid reacting with a metal does not generally follow the simple acid + metal → hydrogen pattern.","zh":"硝酸与金属反应通常不能套用普通酸与金属反应放出氢气的规律。"},"questions":[{"id":"nonmetals-0","prompt":{"en":"Which gas turns moist red litmus paper blue?","zh":"哪种气体能使湿润的红色石蕊试纸变蓝？"},"options":{"en":["CO₂","SO₂","NH₃","O₂"],"zh":["CO₂","SO₂","NH₃","O₂"]},"answer":2,"explanation":{"en":"Ammonia produces a basic aqueous environment.","zh":"氨气溶于水后使溶液呈碱性。"}},{"id":"nonmetals-1","prompt":{"en":"What is the oxidation number of N in NH₄⁺?","zh":"NH₄⁺ 中氮元素的化合价是？"},"options":{"en":["−3","−1","+3","+5"],"zh":["−3","−1","+3","+5"]},"answer":0,"explanation":{"en":"x + 4(+1) = +1, therefore x = −3.","zh":"x + 4×(+1) = +1，得 x = −3。"}}]},{"id":"rates","book":"c2","title":{"en":"Energy & reaction rates","zh":"化学反应与能量"},"points":{"en":["Exothermic reactions release energy to the surroundings; their enthalpy change ΔH is negative.","Reaction rate depends on conditions such as temperature, concentration and surface area.","A catalyst offers a different pathway with lower activation energy. It does not change the reaction enthalpy or equilibrium constant at fixed temperature."],"zh":["放热反应向环境释放能量，反应焓变 ΔH \u003c 0。","温度、浓度、接触面积等条件可以影响反应速率。","催化剂提供活化能较低的反应路径。在一定温度下，不改变反应焓变和平衡常数。"]},"example":{"en":"Powdered calcium carbonate usually reacts faster with dilute acid than equal-mass chips under otherwise identical conditions, because it exposes more surface.","zh":"其他条件相同时，等质量碳酸钙粉末通常比块状碳酸钙与稀酸反应更快，因为接触面积更大。"},"pitfall":{"en":"Faster reaction does not necessarily mean more final product. Rate and equilibrium yield are different ideas.","zh":"反应更快不代表最终产物更多。反应速率与平衡产率是不同概念。"},"questions":[{"id":"rates-0","prompt":{"en":"Which quantity does a catalyst lower?","zh":"催化剂降低的是？"},"options":{"en":["Activation energy","Product mass in every case","Reaction enthalpy","Equilibrium constant"],"zh":["活化能","所有反应中的产物质量","反应焓变","平衡常数"]},"answer":0,"explanation":{"en":"A catalyst lowers the activation barrier through an alternative pathway.","zh":"催化剂通过改变反应路径降低活化能。"}},{"id":"rates-1","prompt":{"en":"An exothermic reaction has…","zh":"放热反应的焓变满足……"},"options":{"en":["ΔH > 0","ΔH = 0 always","ΔH \u003c 0","No energy change"],"zh":["ΔH > 0","ΔH 总为 0","ΔH \u003c 0","没有能量变化"]},"answer":2,"explanation":{"en":"The system releases heat at constant pressure, so ΔH is negative.","zh":"恒压条件下体系放热，焓变为负。"}}]},{"id":"organic","book":"c2","title":{"en":"Organic chemistry essentials","zh":"有机化合物入门"},"points":{"en":["Carbon commonly forms four covalent bonds. Hydrocarbons contain only carbon and hydrogen.","Alkanes are saturated; an acyclic alkane has formula CₙH₂ₙ₊₂.","An alkene contains a C=C double bond and can undergo addition reactions."],"zh":["碳原子通常形成四个共价键。烃只含碳、氢两种元素。","烷烃为饱和链烃，通式为 CₙH₂ₙ₊₂。","烯烃含碳碳双键，可以发生加成反应。"]},"example":{"en":"Ethene reacts with bromine by addition: CH₂=CH₂ + Br₂ → CH₂Br–CH₂Br. Bromine colour fades under suitable test conditions.","zh":"乙烯与溴发生加成反应：CH₂=CH₂ + Br₂ → CH₂Br–CH₂Br。在适当条件下可观察到溴的颜色褪去。"},"pitfall":{"en":"A molecular formula alone may not identify one compound: structural isomers can share the same formula.","zh":"分子式相同不代表结构相同；同分异构体可具有相同分子式。"},"questions":[{"id":"organic-0","prompt":{"en":"Which is an alkane?","zh":"下列属于烷烃的是？"},"options":{"en":["C₂H₄","C₂H₂","C₂H₆","C₂H₅OH"],"zh":["C₂H₄","C₂H₂","C₂H₆","C₂H₅OH"]},"answer":2,"explanation":{"en":"Ethane C₂H₆ fits the acyclic alkane formula CₙH₂ₙ₊₂.","zh":"乙烷 C₂H₆ 符合链状烷烃的通式 CₙH₂ₙ₊₂。"}},{"id":"organic-1","prompt":{"en":"Ethene reacts with bromine mainly by…","zh":"乙烯与溴发生的主要反应类型是？"},"options":{"en":["Addition","Neutralisation","Precipitation","Esterification"],"zh":["加成反应","中和反应","沉淀反应","酯化反应"]},"answer":0,"explanation":{"en":"Atoms add across the carbon–carbon double bond.","zh":"溴原子加到碳碳双键两端，生成加成产物。"}}]},{"id":"environment","book":"c2","title":{"en":"Chemistry, resources & environment","zh":"化学与可持续发展"},"points":{"en":["Atom economy compares the formula mass of desired product with the total formula masses of reactants in a balanced equation, including coefficients.","High yield and high atom economy measure different things.","Resource efficiency includes raw materials, energy, waste and recycling; assess the whole process."],"zh":["原子利用率依据配平反应式，比较目标产物与全部反应物的相对分子质量总和，需计入系数。","产率与原子利用率衡量不同方面，不能混同。","资源利用应综合考虑原料、能耗、废物和回收等整个过程。"]},"example":{"en":"For CaCO₃ → CaO + CO₂, taking relative formula masses 100, 56 and 44, atom economy for CaO is 56/100 × 100% = 56%.","zh":"CaCO₃ → CaO + CO₂，取相对分子质量依次为 100、56、44。以 CaO 为目标产物，原子利用率为 56%。"},"pitfall":{"en":"A process with 100% yield can still generate substantial by-products.","zh":"产率达到 100% 的过程仍可能产生大量副产物。"},"questions":[{"id":"environment-0","prompt":{"en":"For CaCO₃ → CaO + CO₂, atom economy for CaO is approximately…","zh":"CaCO₃ → CaO + CO₂，以 CaO 为目标产物，原子利用率约为？"},"options":{"en":["44%","56%","100%","156%"],"zh":["44%","56%","100%","156%"]},"answer":1,"explanation":{"en":"56/100 × 100% = 56%.","zh":"56/100 × 100% = 56%。"}},{"id":"environment-1","prompt":{"en":"Which is evidence of better resource efficiency?","zh":"下列哪项可体现更好的资源利用？"},"options":{"en":["More waste per kilogram of product","More energy for the same output","Recovering and reusing suitable solvents","Ignoring by-products"],"zh":["单位产物废物更多","相同产出消耗更多能源","回收并重复利用适当的溶剂","忽略副产物"]},"answer":2,"explanation":{"en":"Solvent recovery can reduce consumption and waste; the full process still needs assessment.","zh":"溶剂回收可减少消耗与废物，仍需结合完整过程评价。"}}]},{"id":"equilibrium","book":"s1","title":{"en":"Chemical equilibrium","zh":"化学平衡"},"points":{"en":["At dynamic equilibrium in a closed system, forward and reverse reaction rates are equal; reactions continue.","Equilibrium concentrations remain constant but are not necessarily equal.","At fixed temperature, K is fixed for a given reaction. A catalyst speeds approach to equilibrium without shifting it."],"zh":["密闭体系达到动态平衡时，正、逆反应速率相等，反应仍在进行。","平衡时各组分浓度保持不变，但浓度不一定相等。","一定温度下，给定反应的平衡常数不变。催化剂加快达到平衡，不改变平衡位置。"]},"example":{"en":"For N₂(g) + 3H₂(g) ⇌ 2NH₃(g), Kc = [NH₃]²/([N₂][H₂]³). Compression at fixed temperature favours the side with fewer gas molecules.","zh":"对 N₂(g) + 3H₂(g) ⇌ 2NH₃(g)，Kc = c²(NH₃)/[c(N₂)c³(H₂)]。恒温压缩容积有利于平衡向气体分子数减少的方向移动。"},"pitfall":{"en":"Equilibrium does not mean the reaction has stopped. Adding a catalyst does not increase the equilibrium yield.","zh":"平衡不代表反应停止。加入催化剂不会提高平衡产率。"},"questions":[{"id":"equilibrium-0","prompt":{"en":"At equilibrium, the forward reaction rate is…","zh":"达到化学平衡时，正反应速率……"},"options":{"en":["Zero","Equal to the reverse rate","Always greater than the reverse rate","Unrelated to the reverse rate"],"zh":["为零","等于逆反应速率","总大于逆反应速率","与逆反应速率无关"]},"answer":1,"explanation":{"en":"Both reactions continue at equal rates.","zh":"正、逆反应仍在进行，且速率相等。"}},{"id":"equilibrium-1","prompt":{"en":"For a fixed reaction, which change can change K?","zh":"对给定反应，哪项变化可以改变平衡常数？"},"options":{"en":["Adding a catalyst","Changing initial concentration only","Changing temperature","Changing container size at fixed temperature"],"zh":["加入催化剂","只改变初始浓度","改变温度","恒温改变容器体积"]},"answer":2,"explanation":{"en":"K depends on temperature, not on the starting composition.","zh":"平衡常数与温度有关，与初始组成无关。"}}]},{"id":"aqueous","book":"s1","title":{"en":"Acids, bases & aqueous equilibria","zh":"水溶液中的离子反应与平衡"},"points":{"en":["pH = −log₁₀[H⁺] in the dilute-solution school approximation, with concentration in mol/L.","At 25 °C, Kw ≈ 1.0 × 10⁻¹⁴ and a neutral solution has pH ≈ 7.","Strong acids ionise essentially completely in dilute water; weak acids establish an ionisation equilibrium."],"zh":["在高中稀溶液近似中，pH = −lg c(H⁺)，浓度以 mol/L 表示。","25 ℃ 时，Kw ≈ 1.0 × 10⁻¹⁴，中性溶液的 pH 约为 7。","强酸在稀水溶液中基本完全电离，弱酸存在电离平衡。"]},"example":{"en":"For 0.010 mol/L HCl at 25 °C, neglecting water autoionisation, [H⁺] ≈ 10⁻² mol/L, so pH ≈ 2.","zh":"25 ℃ 时，0.010 mol/L HCl 溶液忽略水的电离，c(H⁺) ≈ 10⁻² mol/L，pH ≈ 2。"},"pitfall":{"en":"Acid strength is not concentration. A dilute strong acid is still a strong acid.","zh":"酸的强弱与浓度不同。稀的强酸仍属于强酸。"},"questions":[{"id":"aqueous-0","prompt":{"en":"What is the approximate pH of 0.001 mol/L HCl at 25 °C?","zh":"25 ℃ 时，0.001 mol/L HCl 的 pH 近似为？"},"options":{"en":["1","2","3","11"],"zh":["1","2","3","11"]},"answer":2,"explanation":{"en":"pH = −log₁₀(10⁻³) = 3.","zh":"pH = −lg(10⁻³) = 3。"}},{"id":"aqueous-1","prompt":{"en":"At 25 °C, a neutral aqueous solution has…","zh":"25 ℃ 时，中性水溶液满足……"},"options":{"en":["[H⁺] > [OH⁻]","[H⁺] = [OH⁻]","[H⁺] = 0","[OH⁻] = 0"],"zh":["c(H⁺) > c(OH⁻)","c(H⁺) = c(OH⁻)","c(H⁺) = 0","c(OH⁻) = 0"]},"answer":1,"explanation":{"en":"Neutrality means equal hydrogen- and hydroxide-ion concentrations.","zh":"中性表示氢离子与氢氧根离子浓度相等。"}}]},{"id":"electrons","book":"s2","title":{"en":"Electron arrangements","zh":"原子结构与电子排布"},"points":{"en":["Electrons occupy orbitals. An orbital can hold at most two electrons with opposite spins.","Ground-state electron arrangements follow energy ordering, Pauli exclusion and Hund's rule.","For the first 20 elements, simple shell arrangements help explain common ion formation and periodic trends."],"zh":["电子占据原子轨道，每个轨道最多容纳两个自旋方向相反的电子。","基态电子排布遵循能量最低原理、泡利原理和洪特规则。","前 20 号元素的电子层排布可帮助理解常见离子的形成和周期性变化。"]},"example":{"en":"Sodium has shell arrangement 2,8,1 and commonly loses one outer electron to form Na⁺ with arrangement 2,8.","zh":"钠原子电子层排布为 2、8、1，常失去最外层的一个电子，形成排布为 2、8 的 Na⁺。"},"pitfall":{"en":"Shell diagrams are a model. Electrons do not travel on literal circular tracks like planets.","zh":"电子层示意图是一种模型，不能将电子理解为沿固定圆形轨道运行的小行星。"},"questions":[{"id":"electrons-0","prompt":{"en":"An orbital holds at most how many electrons?","zh":"一个原子轨道最多容纳多少个电子？"},"options":{"en":["1","2","8","18"],"zh":["1","2","8","18"]},"answer":1,"explanation":{"en":"The Pauli exclusion principle allows two electrons of opposite spin per orbital.","zh":"根据泡利原理，每个轨道最多容纳两个自旋方向相反的电子。"}},{"id":"electrons-1","prompt":{"en":"The shell arrangement of a neutral Na atom is…","zh":"中性钠原子的电子层排布是？"},"options":{"en":["2,8","2,8,1","2,7,2","2,8,2"],"zh":["2、8","2、8、1","2、7、2","2、8、2"]},"answer":1,"explanation":{"en":"Na has 11 electrons: 2 + 8 + 1.","zh":"钠有 11 个电子，按 2、8、1 排列。"}}]},{"id":"bonding","book":"s2","title":{"en":"Bonding & molecular interactions","zh":"化学键与分子间作用力"},"points":{"en":["Ionic bonding is electrostatic attraction between oppositely charged ions. Covalent bonding involves shared electron pairs.","Molecular shape depends on electron-pair arrangement, including lone pairs.","Intermolecular attractions are distinct from covalent bonds within molecules and influence boiling and melting."],"zh":["离子键是阴、阳离子之间的静电作用；共价键与原子间共用电子对有关。","分子空间结构与成键电子对和孤电子对的排布有关。","分子间作用力与分子内共价键不同，会影响物质的熔点和沸点。"]},"example":{"en":"Water is bent, not linear. Its O–H bonds are polar and their dipoles do not cancel, making the molecule polar.","zh":"水分子呈 V 形，O—H 键具有极性，键偶极不能相互抵消，因此水是极性分子。"},"pitfall":{"en":"A polar bond does not guarantee a polar molecule: the two bond dipoles cancel in linear CO₂.","zh":"含极性键的分子不一定是极性分子，如直线形 CO₂ 的键偶极相互抵消。"},"questions":[{"id":"bonding-0","prompt":{"en":"Which molecule is nonpolar overall?","zh":"下列哪种分子整体为非极性？"},"options":{"en":["H₂O","NH₃","CO₂","HCl"],"zh":["H₂O","NH₃","CO₂","HCl"]},"answer":2,"explanation":{"en":"Linear symmetric CO₂ has polar bonds whose dipoles cancel.","zh":"CO₂ 为直线对称结构，两个极性键的偶极相互抵消。"}},{"id":"bonding-1","prompt":{"en":"Boiling liquid water mainly overcomes…","zh":"水沸腾时主要克服的是……"},"options":{"en":["O–H covalent bonds","Intermolecular attractions","Nuclear forces","Ionic bonds in H₂O"],"zh":["O—H 共价键","分子间作用力","核力","水分子中的离子键"]},"answer":1,"explanation":{"en":"The molecules remain H₂O; intermolecular attractions are overcome.","zh":"水分子仍为 H₂O，主要克服分子间作用力。"}}]},{"id":"isomers","book":"s3","title":{"en":"Hydrocarbons & isomerism","zh":"烃与同分异构现象"},"points":{"en":["Structural isomers have the same molecular formula but different atom connectivity.","Alkene reactions often involve the C=C bond. Aromatic compounds have different bonding and reactivity.","Name a compound from its structure; do not infer a unique structure from its formula alone."],"zh":["同分异构体具有相同的分子式，但原子连接方式不同。","烯烃的反应通常涉及碳碳双键，芳香烃的成键方式和反应性质有所不同。","应依据结构命名，不能只凭分子式判断唯一结构。"]},"example":{"en":"C₄H₁₀ has two structural isomers: butane CH₃CH₂CH₂CH₃ and 2-methylpropane (CH₃)₃CH.","zh":"C₄H₁₀ 有两种同分异构体：正丁烷 CH₃CH₂CH₂CH₃ 和异丁烷（2-甲基丙烷）(CH₃)₃CH。"},"pitfall":{"en":"Rotating a single bond or redrawing the same connectivity does not create a structural isomer.","zh":"旋转单键或将同一连接方式重新绘制，不会产生新的构造异构体。"},"questions":[{"id":"isomers-0","prompt":{"en":"How many structural isomers does C₄H₁₀ have?","zh":"C₄H₁₀ 有几种构造异构体？"},"options":{"en":["1","2","3","4"],"zh":["1","2","3","4"]},"answer":1,"explanation":{"en":"Only the straight-chain and one branched structure are possible.","zh":"有直链的正丁烷和支链的异丁烷两种。"}},{"id":"isomers-1","prompt":{"en":"Structural isomers share the same…","zh":"构造异构体一定具有相同的……"},"options":{"en":["Molecular formula","Connectivity","Boiling point","Chemical reactivity"],"zh":["分子式","原子连接方式","沸点","化学反应性"]},"answer":0,"explanation":{"en":"The molecular formula is the same, but connectivity differs.","zh":"构造异构体分子式相同，原子连接方式不同。"}}]},{"id":"functional","book":"s3","title":{"en":"Oxygen-containing functional groups","zh":"烃的含氧衍生物"},"points":{"en":["Functional groups help determine chemical properties: hydroxyl in alcohols, carboxyl in carboxylic acids, and ester linkage in esters.","Alcohols and carboxylic acids can undergo reversible esterification under suitable conditions.","Hydrolysis breaks an ester into related products; conditions affect reversibility and products."],"zh":["官能团影响有机物的化学性质，如醇中的羟基、羧酸中的羧基、酯中的酯基。","醇和羧酸在适当条件下可发生可逆的酯化反应。","酯可发生水解，不同条件下反应的可逆性和产物有所不同。"]},"example":{"en":"CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O. Ethanoic acid and ethanol form ethyl ethanoate and water with an acid catalyst and heating.","zh":"CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O。在酸催化、加热条件下，乙酸与乙醇生成乙酸乙酯和水。"},"pitfall":{"en":"Not every compound containing OH is an alcohol; phenols have OH bonded directly to an aromatic ring.","zh":"含有羟基的化合物不一定是醇，例如酚的羟基直接连在芳环上。"},"questions":[{"id":"functional-0","prompt":{"en":"Which is the carboxyl group?","zh":"羧基的表示是？"},"options":{"en":["–OH","–CHO","–COOH","–NH₂"],"zh":["—OH","—CHO","—COOH","—NH₂"]},"answer":2,"explanation":{"en":"A carboxyl group is –COOH.","zh":"羧基为 —COOH。"}},{"id":"functional-1","prompt":{"en":"Ethanoic acid + ethanol can form…","zh":"乙酸与乙醇在适当条件下可生成……"},"options":{"en":["Ethyl ethanoate and water","Methane and oxygen","Sodium chloride","Ethene only"],"zh":["乙酸乙酯和水","甲烷和氧气","氯化钠","只生成乙烯"]},"answer":0,"explanation":{"en":"This is esterification; water is also formed.","zh":"该反应为酯化反应，同时生成水。"}}]},{"id":"grammar","book":"eng","title":{"en":"Explain a process clearly","zh":"清晰描述过程"},"points":{"en":["Use the present simple for general scientific facts: Heat increases particle motion.","Use the passive when the process matters more than the person: The solution is heated.","Sequence steps with first, then and finally. Keep the procedure and the conclusion separate."],"zh":["一般科学事实常用一般现在时。","强调过程而非操作者时可使用被动语态。","使用 first、then、finally 描述顺序，将步骤与结论分开。"]},"example":{"en":"Active: We add the indicator. Passive: The indicator is added. The passive uses be + past participle.","zh":"主动语态：We add the indicator. 被动语态：The indicator is added。结构为 be + 过去分词。"},"pitfall":{"en":"Do not use 'was increase'. Use 'increased' or 'was increased', depending on the intended meaning.","zh":"不要写 was increase，应根据含义使用 increased 或 was increased。"},"questions":[{"id":"grammar-0","prompt":{"en":"Choose the correct passive sentence.","zh":"选择正确的被动句。"},"options":{"en":["The solution heat.","The solution is heated.","The solution is heat.","The solution heated by."],"zh":["The solution heat.","The solution is heated.","The solution is heat.","The solution heated by."]},"answer":1,"explanation":{"en":"Present simple passive = is/are + past participle.","zh":"一般现在时被动语态为 is/are + 过去分词。"}},{"id":"grammar-1","prompt":{"en":"Choose the best general scientific statement.","zh":"选择最合适的一般科学事实表述。"},"options":{"en":["Water boil at standard pressure at 100 °C.","Water boiling at standard pressure at 100 °C.","Water boils at standard pressure at 100 °C.","Water are boils at standard pressure at 100 °C."],"zh":["Water boil at standard pressure at 100 °C.","Water boiling at standard pressure at 100 °C.","Water boils at standard pressure at 100 °C.","Water are boils at standard pressure at 100 °C."]},"answer":2,"explanation":{"en":"The singular subject 'water' takes 'boils' in the present simple.","zh":"water 为单数概念，谓语用 boils。"}}]},{"id":"evidence","book":"eng","title":{"en":"Evidence & academic writing","zh":"证据与学术表达"},"points":{"en":["Separate observations from explanations: 'the temperature rose' is an observation; 'the reaction released heat' interprets it.","Use measured language such as suggests or is consistent with when evidence is limited.","Build an answer with a claim, evidence and reasoning. Explain how the evidence supports the claim."],"zh":["区分观察与解释：温度上升是观察，反应放热是解释。","证据有限时使用 suggests、is consistent with 等谨慎表达。","用观点、证据、推理组织答案，说明证据如何支持观点。"]},"example":{"en":"Claim: Powder increases the rate. Evidence: The same gas volume formed in 30 s rather than 60 s. Reasoning: Greater surface area exposes more reactant particles.","zh":"观点：粉末加快反应。证据：产生相同体积气体所需时间从 60 s 降至 30 s。推理：接触面积增大，暴露的反应粒子更多。"},"pitfall":{"en":"'This proves' is often too strong for one small experiment. Mention controlled variables and limitations.","zh":"单次小实验使用 This proves 往往过于绝对，应考虑控制变量和局限。"},"questions":[{"id":"evidence-0","prompt":{"en":"Which statement is an observation?","zh":"哪项是观察结果？"},"options":{"en":["The reaction is exothermic.","The temperature rose by 5 °C.","The particles collided more often.","The catalyst lowered activation energy."],"zh":["The reaction is exothermic.","The temperature rose by 5 °C.","The particles collided more often.","The catalyst lowered activation energy."]},"answer":1,"explanation":{"en":"The temperature change is measured; the other statements interpret mechanisms or energy changes.","zh":"温度变化可以直接测量，其余涉及解释或机理。"}},{"id":"evidence-1","prompt":{"en":"Which phrase best signals a cautious interpretation?","zh":"哪项最适合表达谨慎的解释？"},"options":{"en":["This always proves…","Everyone knows…","These results suggest…","There is no possible alternative…"],"zh":["This always proves…","Everyone knows…","These results suggest…","There is no possible alternative…"]},"answer":2,"explanation":{"en":"'Suggest' connects evidence to an interpretation without overstating certainty.","zh":"suggest 连接证据与解释，同时避免过度断言。"}}]},{"id":"reading","book":"eng","title":{"en":"Reading scientific English","zh":"科学英语阅读"},"points":{"en":["Find the main claim before focusing on unfamiliar words.","Use context and word families: dissolve → solution; react → reaction → reactive.","Track logical connectors: because introduces a reason, whereas contrasts, and therefore introduces a consequence."],"zh":["先找主旨，再处理生词。","借助上下文与词族理解科学术语。","注意 because 表示原因，whereas 表示对比，therefore 表示结果。"]},"example":{"en":"'The powder reacted faster because it had a larger surface area.' The main claim is faster reaction; the because-clause gives the explanation.","zh":"句子 The powder reacted faster because it had a larger surface area 中，主句是结果，because 从句解释原因。"},"pitfall":{"en":"'Whereas' contrasts two ideas; it does not normally introduce a cause.","zh":"whereas 用于对比两种情况，通常不表示原因。"},"questions":[{"id":"reading-0","prompt":{"en":"Which connector introduces a consequence?","zh":"哪个连接词通常引出结果？"},"options":{"en":["Whereas","Although","Therefore","Because"],"zh":["Whereas","Although","Therefore","Because"]},"answer":2,"explanation":{"en":"'Therefore' means 'as a result'.","zh":"therefore 表示因此、所以。"}},{"id":"reading-1","prompt":{"en":"Read: 'The salt dissolved, forming a homogeneous solution.' What does homogeneous mean here?","zh":"阅读句子：The salt dissolved, forming a homogeneous solution。homogeneous 的含义是？"},"options":{"en":["Uniform throughout","Always coloured","Insoluble","Solid"],"zh":["Uniform throughout","Always coloured","Insoluble","Solid"]},"answer":0,"explanation":{"en":"A homogeneous solution has uniform composition on the scale considered.","zh":"homogeneous 表示均一的。"}}]}],"UI":{"en":{"lang":"en","brand":"CHEMHOUSE","strap":"A little curiosity. A lot of discovery.","dashboard":"Overview","learn":"Learning library","practice":"Practice room","tools":"Chemistry toolkit","notes":"Study notebook","edition":"Study edition","eng":"English edition","cn":"人教版 · 简体中文","crumb":"Your space to understand more","local":"Your study space","localDesc":"Notes and progress stay in this browser. No account needed.","greeting":"MAKE ROOM FOR A LITTLE DISCOVERY","hero":"Small steps.\u003cbr>Big reactions.","intro":"Build your chemistry intuition and your English confidence. Learn a concept, try a question, and make it yours.","start":"Start learning","quiz":"Try a quick quiz","art":"Curiosity is the catalyst.","artStrong":"Let's find your next reaction.","lessons":"Lessons explored","answered":"Questions answered","accuracy":"Latest-answer accuracy","unique":"Distinct questions","starter":"Original starter lessons","open":"Open library","paths":"Choose your next discovery","pathDesc":"Short explanations. Worked examples. A question to make it click.","continue":"Explore lessons","progress":"explored","tipTitle":"A formula is only the beginning.","tipDesc":"Turn mass into moles, check a concentration, or explore the first 20 elements. Build the habit of checking units.","openTools":"Open the toolkit","next":"Pick up a useful skill","engTitle":"Science meets English","engDesc":"Describe experiments, read with purpose, and build evidence-based answers.",
