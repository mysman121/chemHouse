   const payload={edition:lang,curriculum:chat.course,context,messages:[...history,{role:"user",content:question}]};
   while(new TextEncoder().encode(JSON.stringify(payload)).length>65536&&payload.messages.length>1)payload.messages.splice(0,2);
   const response=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},signal:controller.signal,body:JSON.stringify(payload)});
   const result=await response.json();
   if(chats[lang]!==chat||controller.signal.aborted)return;
   if(!response.ok){
     chat.error=({not_configured:"aiUnavailable",configuration:"aiUnavailable",credits:"aiUnavailable",unavailable:"aiUnavailable",rate_limited:"aiRate",timeout:"aiTimeout",busy:"aiBusy"})[result.error]||"aiFailed";
   }else if(typeof result.answer==="string"&&result.answer.trim()){
     chat.messages.push({role:"assistant",content:result.answer,truncated:result.truncated});succeeded=true;
     chat.messages=chat.messages.slice(-20);
   }else chat.error="aiFailed";
 }catch(e){if(chats[lang]===chat)chat.error=e.name==="AbortError"?"aiTimeout":"aiNetwork";}

   }
 }

const fallback=()=>({read:[],answers:{},notes:""});
const validIds=new Set(LESSONS.map(l=>l.id)),questionIds=new Set(LESSONS.flatMap(l=>l.questions.map(q=>q.id)));
function sanitiseRecord(raw){
  if(!raw||typeof raw!=="object")return fallback();
  const result=fallback();
  result.read=Array.isArray(raw.read)?[...new Set(raw.read.filter(id=>validIds.has(id)))]:[];
  result.notes=typeof raw.notes==="string"?raw.notes:"";
  if(raw.answers&&typeof raw.answers==="object")for(const lesson of LESSONS)for(const q of lesson.questions){
    const a=raw.answers[q.id];
    if(a&&Number.isInteger(a.choice)&&a.choice>=0&&a.choice<q.options.en.length)
      result.answers[q.id]={choice:a.choice,correct:a.choice===q.answer};
  }
  return result;
}

function route(){
  const parts=location.hash.replace(/^#\/?/,"").split("/");
  let nextEdition=["en","zh","hk"].includes(parts[0])?parts[0]:parts[0]==="zh-HK"?"hk":"en";
  if(!parts[0]){
    try{const stored=localStorage.getItem("chemhouse-edition");nextEdition=["en","zh","hk"].includes(stored)?stored:"hk";}catch{}
    const queryEdition=new URLSearchParams(location.search).get("edition");
    if(queryEdition==="zh-CN"||queryEdition==="zh_CN")nextEdition="zh";
    if(["hk","zh-HK","zh-TW","zh-Hant"].includes(queryEdition))nextEdition="hk";
    location.replace("#/"+nextEdition+"/home");return;
  }
  if(edition!==nextEdition||!document.documentElement.dataset.initialised){edition=nextEdition;readRecord();}
  document.documentElement.dataset.initialised="true";
  try{localStorage.setItem("chemhouse-edition",edition);}catch{}
  view=["home","learn","lesson","practice","tools","notes","about","ai"].includes(parts[1])?parts[1]:"home";
  try{detail=decodeURIComponent(parts[2]||"");}catch{detail="";}
  if((view==="lesson"||view==="practice")&&detail&&!visibleLessons().some(l=>l.id===detail)){view="learn";detail="";}

  window.scrollTo({top:0,behavior:"instant"});
}

function calculate(first,divisor){
 if(typeof first!=="string"||typeof divisor!=="string"||!first.trim()||!divisor.trim())return {error:"invalid"};
 const a=Number(first),b=Number(divisor);
 if(!Number.isFinite(a)||!Number.isFinite(b)||a<0||b<=0)return {error:"invalid"};
 const answer=a/b;
 if(!Number.isFinite(answer)||(a!==0&&answer===0))return {error:"range"};
 return {value:answer,display:answer===0?"0":Number(answer.toPrecision(6)).toString()};
}

document.addEventListener("click",event=>{

 if(action==="ai-clear"){chats[edition].controller?.abort();chats[edition]=newChat(edition);render();return;}
 if(action==="ai-stop"){const old=chats[edition];old.controller?.abort();chats[edition]={...old,messages:old.messages.slice(0,-1),draft:old.messages.at(-1)?.content||"",pending:false,error:"",controller:null};render();return;}

 if(action==="ask-lesson"){const chat=chats[edition];if(!chat.messages.length&&!chat.pending)chat.lesson=value;nav("ai");return;}
 if(action==="challenge"){const ls=visibleLessons().filter(l=>l.hkOnly);nav("practice",ls[Math.floor(Math.random()*ls.length)].id);}
 else if(action==="go"){if(value==="learn"){libraryFilter="all";searchTerm="";}nav(value);}
 else if(action==="edition"){
   if(!["en","zh","hk"].includes(value))return;
   location.hash="#/"+value+"/home";libraryFilter="all";searchTerm="";
 }
 else if(action==="learn-book"){libraryFilter=value;searchTerm="";nav("learn");}
 else if(action==="lesson")nav("lesson",value);
 else if(action==="topic")nav("practice",value);
 else if(action==="complete"){
   if(!visibleLessons().some(l=>l.id===value))return;
   if(!record.read.includes(value))record.read.push(value);
   save();render();
 }
 else if(action==="print")window.print();
 else if(action==="answer"){
   const q=allQuestions().find(q=>q.id===b.dataset.question),choice=Number(value);
   if(!q||record.answers[q.id]||!Number.isInteger(choice)||choice<0||choice>=q.options[edition].length)return;

   const feedback=$("feedback-"+q.id);if(feedback)feedback.focus({preventScroll:true});

{"en":["The mole is a unit of amount of substance. 1 mol contains exactly 6.02214076 × 10²³ specified entities.","Use n = m/M, with m in g and molar mass M in g·mol⁻¹.","For solutions, c = n/V with V in litres. Always specify the entity: atoms, molecules or ions."],"zh":["摩尔是物质的量的单位。1 mol 指定微粒含有 6.02214076 × 10²³ 个微粒。","使用 n = m/M 时，质量 m 的单位为 g，摩尔质量 M 的单位为 g·mol⁻¹。","物质的量浓度 c = n/V，体积 V 以 L 表示。必须指明微粒种类。"],"hk":["摩爾是摩爾數的單位。1 mol 指定微粒含有 6.02214076 × 10²³ 個微粒。","使用 n = m/M 時，質量 m 的單位為 g，摩爾質量 M 的單位為 g·mol⁻¹。","摩爾濃度 c = n/V，體積 V 以 L 表示。必須指明微粒種類。"]},"example":{"en":"Using M(H₂O) ≈ 18.0 g·mol⁻¹, 9.0 g of water is 9.0/18.0 = 0.50 mol of H₂O molecules.","zh":"取 M(H₂O) ≈ 18.0 g·mol⁻¹，9.0 g 水的物质的量为 9.0/18.0 = 0.50 mol。","hk":"取 M(H₂O) ≈ 18.0 g·mol⁻¹，9.0 g 水的摩爾數為 9.0/18.0 = 0.50 mol。"},"pitfall":{"en":"22.4 L·mol⁻¹ is an approximate gas molar volume at 0 °C and 101 kPa; do not apply it to liquids or arbitrary conditions.","zh":"22.4 L·mol⁻¹ 是标准状况下气体摩尔体积的近似值，不能直接用于液体或任意温压条件。","hk":"22.4 L·mol⁻¹ 是標準狀況下氣體摩爾體積的近似值，不能直接用於液體或任意温壓條件。"},"questions":[{"id":"moles-0","prompt":{"en":"How many moles are in 5.85 g NaCl? Use M = 58.5 g·mol⁻¹.","zh":"5.85 g NaCl 的物质的量是多少？取 M = 58.5 g·mol⁻¹。","hk":"5.85 g NaCl 的摩爾數是多少？取 M = 58.5 g·mol⁻¹。"},"options":{"en":["0.010 mol","0.100 mol","1.00 mol","10.0 mol"],"zh":["0.010 mol","0.100 mol","1.00 mol","10.0 mol"],"hk":["0.010 mol","0.100 mol","1.00 mol","10.0 mol"]},"answer":1,"explanation":{"en":"n = m/M = 5.85/58.5 = 0.100 mol.","zh":"n = m/M = 5.85/58.5 = 0.100 mol。","hk":"n = m/M = 5.85/58.5 = 0.100 mol。"}},{"id":"moles-1","prompt":{"en":"0.20 mol solute is dissolved to make 500 mL solution. What is c?","zh":"将 0.20 mol 溶质配成 500 mL 溶液，物质的量浓度是多少？","hk":"將 0.20 mol 溶質配成 500 mL 溶液，摩爾濃度是多少？"},"options":{"en":["0.10 mol/L","0.20 mol/L","0.40 mol/L","100 mol/L"],"zh":["0.10 mol/L","0.20 mol/L","0.40 mol/L","100 mol/L"],"hk":["0.10 mol/L","0.20 mol/L","0.40 mol/L","100 mol/L"]},"answer":2,"explanation":{"en":"Convert 500 mL to 0.500 L. c = 0.20/0.500 = 0.40 mol/L.","zh":"500 mL = 0.500 L，c = 0.20/0.500 = 0.40 mol/L。","hk":"500 mL = 0.500 L，c = 0.20/0.500 = 0.40 mol/L。"}}],"mainlandBook":"c1","hkBook":"h3"},{"id":"redox","book":"c1","title":{"en":"Oxidation & reduction","zh":"氧化还原反应","hk":"氧化還原反應"},"points":{"en":["Oxidation is loss of electrons; reduction is gain of electrons.","Oxidation numbers rise in oxidation and fall in reduction.","The oxidising agent accepts electrons and is reduced. The reducing agent loses electrons and is oxidised."],"zh":["氧化是失电子的过程，还原是得电子的过程。","氧化反应中元素化合价升高，还原反应中元素化合价降低。","氧化剂得电子、被还原；还原剂失电子、被氧化。"],"hk":["氧化是失電子的過程，還原是得電子的過程。","氧化反應中元素化合價升高，還原反應中元素化合價降低。","氧化劑得電子、被還原；還原劑失電子、被氧化。"]},"example":{"en":"In Zn + Cu²⁺ → Zn²⁺ + Cu, Zn loses 2 electrons and is the reducing agent. Cu²⁺ gains 2 electrons and is the oxidising agent.","zh":"在 Zn + Cu²⁺ → Zn²⁺ + Cu 中，Zn 失去 2 个电子，是还原剂；Cu²⁺ 得到 2 个电子，是氧化剂。","hk":"在 Zn + Cu²⁺ → Zn²⁺ + Cu 中，Zn 失去 2 個電子，是還原劑；Cu²⁺ 得到 2 個電子，是氧化劑。"},"pitfall":{"en":"Oxidation does not have to involve oxygen. Distinguish the agent from the process it undergoes.","zh":"氧化反应不一定有氧参加。注意区分试剂的性质与其自身发生的变化。","hk":"氧化反應不一定有氧參加。注意區分試劑的性質與其自身發生的變化。"},"questions":[{"id":"redox-0","prompt":{"en":"In Zn + Cu²⁺ → Zn²⁺ + Cu, which is the reducing agent?","zh":"在 Zn + Cu²⁺ → Zn²⁺ + Cu 中，还原剂是？","hk":"在 Zn + Cu²⁺ → Zn²⁺ + Cu 中，還原劑是？"},"options":{"en":["Zn","Cu²⁺","Zn²⁺","Cu"],"zh":["Zn","Cu²⁺","Zn²⁺","Cu"],"hk":["Zn","Cu²⁺","Zn²⁺","Cu"]},"answer":0,"explanation":{"en":"Zn donates electrons and is oxidised; it reduces Cu²⁺.","zh":"Zn 失电子被氧化，使 Cu²⁺ 被还原，因此是还原剂。","hk":"Zn 失電子被氧化，使 Cu²⁺ 被還原，因此是還原劑。"}},{"id":"redox-1","prompt":{"en":"What is the oxidation number of S in H₂SO₄?","zh":"H₂SO₄ 中硫元素的化合价为？","hk":"H₂SO₄ 中硫元素的化合價為？"},"options":{"en":["−2","+2","+4","+6"],"zh":["−2","+2","+4","+6"],"hk":["−2","+2","+4","+6"]},"answer":3,"explanation":{"en":"2(+1) + x + 4(−2) = 0, so x = +6.","zh":"2×(+1) + x + 4×(−2) = 0，得 x = +6。","hk":"2×(+1) + x + 4×(−2) = 0，得 x = +6。"}}],"mainlandBook":"c1","hkBook":"h5"},{"id":"metals","book":"c1","title":{"en":"Metals & ionic equations","zh":"金属及离子反应","hk":"金屬及離子反應"},"points":{"en":["More reactive metals can displace less reactive metals from suitable salt solutions.","In ionic equations, split soluble strong electrolytes in aqueous solution into ions; keep solids, gases, water and weak electrolytes intact.","Atoms and total charge must balance on both sides."],"zh":["较活泼金属可在适当条件下从盐溶液中置换出较不活泼金属。","书写离子方程式时，将水溶液中可溶性强电解质拆为离子；固体、气体、水和弱电解质保留化学式。","离子方程式必须同时满足原子守恒和电荷守恒。"],"hk":["較活潑金屬可在適當條件下從鹽溶液中置換出較不活潑金屬。","書寫離子方程式時，將水溶液中可溶性強電解質拆為離子；固體、氣體、水和弱電解質保留化學式。","離子方程式必須同時滿足原子守恆和電荷守恆。"]},"example":{"en":"Mixing BaCl₂(aq) and Na₂SO₄(aq) gives Ba²⁺ + SO₄²⁻ → BaSO₄(s). Na⁺ and Cl⁻ are spectator ions.","zh":"BaCl₂ 溶液与 Na₂SO₄ 溶液混合：Ba²⁺ + SO₄²⁻ → BaSO₄↓。Na⁺ 和 Cl⁻ 不参与净反应。","hk":"BaCl₂ 溶液與 Na₂SO₄ 溶液混合：Ba²⁺ + SO₄²⁻ → BaSO₄↓。Na⁺ 和 Cl⁻ 不參與淨反應。"},"pitfall":{"en":"Sodium reacts with water in aqueous salt solutions; do not assume it simply displaces the dissolved metal.","zh":"钠在盐溶液中会先与水反应，不能简单套用金属置换规律。","hk":"鈉在鹽溶液中會先與水反應，不能簡單套用金屬置換規律。"},"questions":[{"id":"metals-0","prompt":{"en":"What is the net ionic equation for dilute HCl reacting with NaOH(aq)?","zh":"稀盐酸与 NaOH 溶液反应的离子方程式是？","hk":"稀鹽酸與 NaOH 溶液反應的離子方程式是？"},"options":{"en":["H⁺ + OH⁻ → H₂O","Na⁺ + Cl⁻ → NaCl","H₂ + O₂ → H₂O","H⁺ → H₂"],"zh":["H⁺ + OH⁻ → H₂O","Na⁺ + Cl⁻ → NaCl","H₂ + O₂ → H₂O","H⁺ → H₂"],"hk":["H⁺ + OH⁻ → H₂O","Na⁺ + Cl⁻ → NaCl","H₂ + O₂ → H₂O","H⁺ → H₂"]},"answer":0,"explanation":{"en":"H⁺ and OH⁻ form water; the other dissolved ions are spectators.","zh":"H⁺ 与 OH⁻ 生成水，其他离子为旁观离子。","hk":"H⁺ 與 OH⁻ 生成水，其他離子為旁觀離子。"}},{"id":"metals-1","prompt":{"en":"Which pair produces a precipitate on mixing aqueous solutions?","zh":"下列两组离子在溶液中相遇，哪组会生成沉淀？","hk":"下列兩組離子在溶液中相遇，哪組會生成沉澱？"},"options":{"en":["Na⁺ and Cl⁻","K⁺ and NO₃⁻","Ba²⁺ and SO₄²⁻","H⁺ and Cl⁻"],"zh":["Na⁺ 与 Cl⁻","K⁺ 与 NO₃⁻","Ba²⁺ 与 SO₄²⁻","H⁺ 与 Cl⁻"],"hk":["Na⁺ 與 Cl⁻","K⁺ 與 NO₃⁻","Ba²⁺ 與 SO₄²⁻","H⁺ 與 Cl⁻"]},"answer":2,"explanation":{"en":"Barium sulfate is insoluble in water.","zh":"BaSO₄ 难溶于水，生成白色沉淀。","hk":"BaSO₄ 難溶於水，生成白色沉澱。"}}],"mainlandBook":"c1","hkBook":"h3"},{"id":"periodic","book":"c1","title":{"en":"Atomic structure & periodic trends","zh":"原子结构与元素周期律","hk":"原子結構與元素週期律"},"points":{"en":["Atomic number equals proton number. A neutral atom has equal numbers of protons and electrons.","Isotopes have the same proton number but different neutron numbers.","Across a period, atomic radius generally decreases; down a main group, it generally increases."],"zh":["原子序数等于质子数。中性原子的电子数等于质子数。","同位素具有相同的质子数、不同的中子数。","同周期主族元素原子半径通常从左向右减小；同主族通常从上到下增大。"],"hk":["原子序數等於質子數。中性原子的電子數等於質子數。","同位素具有相同的質子數、不同的中子數。","同週期主族元素原子半徑通常從左向右減小；同主族通常從上到下增大。"]},"example":{"en":"²³Na has 11 protons and 12 neutrons. Na⁺ has 10 electrons; forming the ion does not change its nucleus.","zh":"²³Na 含 11 个质子、12 个中子。Na⁺ 含 10 个电子，形成离子时原子核不变。","hk":"²³Na 含 11 個質子、12 箇中子。Na⁺ 含 10 個電子，形成離子時原子核不變。"},"pitfall":{"en":"Mass number is protons + neutrons, not the relative atomic mass averaged across natural isotopes.","zh":"质量数等于质子数与中子数之和，不能与天然同位素平均得到的相对原子质量混同。","hk":"質量數等於質子數與中子數之和，不能與天然同位素平均得到的相對原子質量混同。"},"questions":[{"id":"periodic-0","prompt":{"en":"How many electrons are in Mg²⁺? Atomic number of Mg is 12.","zh":"Mg 的原子序数为 12，Mg²⁺ 中有多少个电子？","hk":"Mg 的原子序數為 12，Mg²⁺ 中有多少個電子？"},"options":{"en":["10","12","14","24"],"zh":["10","12","14","24"],"hk":["10","12","14","24"]},"answer":0,"explanation":{"en":"The neutral atom has 12 electrons and loses 2 to form Mg²⁺.","zh":"中性 Mg 原子有 12 个电子，失去 2 个电子后剩下 10 个。","hk":"中性 Mg 原子有 12 個電子，失去 2 個電子後剩下 10 個。"}},{"id":"periodic-1","prompt":{"en":"Isotopes of an element differ in their…","zh":"同种元素的不同同位素，其差异在于……","hk":"同種元素的不同同位素，其差異在於……"},"options":{"en":["Proton number","Neutron number","Atomic number","Element symbol"],"zh":["质子数","中子数","原子序数","元素符号"],"hk":["質子數","中子數","原子序數","元素符號"]},"answer":1,"explanation":{"en":"Proton number defines the element; isotopes differ in neutron number.","zh":"质子数决定元素种类，同位素的中子数不同。","hk":"質子數決定元素種類，同位素的中子數不同。"}}],"mainlandBook":"c1","hkBook":"h2"},{"id":"nonmetals","book":"c2","title":{"en":"Sulfur, nitrogen & their compounds","zh":"硫、氮及其化合物","hk":"硫、氮及其化合物"},"points":{"en":["SO₂ is an acidic oxide. In water it participates in equilibria involving sulfurous acid species.","Nitrogen shows several oxidation states. NH₃ is basic in water; nitric acid is an oxidising acid.","Ammonium ions react with hydroxide on heating to release ammonia."],"zh":["SO₂ 属于酸性氧化物，溶于水后涉及亚硫酸及其相关微粒的平衡。","氮有多种化合价。氨溶于水呈碱性，硝酸具有氧化性。","铵根离子与氢氧根离子共热可放出氨气。"],"hk":["SO₂ 屬於酸性氧化物，溶於水後涉及亞硫酸及其相關微粒的平衡。","氮有多種化合價。氨溶於水呈鹼性，硝酸具有氧化性。","銨根離子與氫氧根離子共熱可放出氨氣。"]},"example":{"en":"NH₄⁺ + OH⁻ → NH₃↑ + H₂O (on heating). Released ammonia turns moist red litmus paper blue.","zh":"NH₄⁺ + OH⁻ → NH₃↑ + H₂O（加热）。氨气可使湿润的红色石蕊试纸变蓝。","hk":"NH₄⁺ + OH⁻ → NH₃↑ + H₂O（加熱）。氨氣可使濕潤的紅色石蕊試紙變藍。"},"pitfall":{"en":"Nitric acid reacting with a metal does not generally follow the simple acid + metal → hydrogen pattern.","zh":"硝酸与金属反应通常不能套用普通酸与金属反应放出氢气的规律。","hk":"硝酸與金屬反應通常不能套用普通酸與金屬反應放出氫氣的規律。"},"questions":[{"id":"nonmetals-0","prompt":{"en":"Which gas turns moist red litmus paper blue?","zh":"哪种气体能使湿润的红色石蕊试纸变蓝？","hk":"哪種氣體能使濕潤的紅色石蕊試紙變藍？"},"options":{"en":["CO₂","SO₂","NH₃","O₂"],"zh":["CO₂","SO₂","NH₃","O₂"],"hk":["CO₂","SO₂","NH₃","O₂"]},"answer":2,"explanation":{"en":"Ammonia produces a basic aqueous environment.","zh":"氨气溶于水后使溶液呈碱性。","hk":"氨氣溶於水後使溶液呈鹼性。"}},{"id":"nonmetals-1","prompt":{"en":"What is the oxidation number of N in NH₄⁺?","zh":"NH₄⁺ 中氮元素的化合价是？","hk":"NH₄⁺ 中氮元素的化合價是？"},"options":{"en":["−3","−1","+3","+5"],"zh":["−3","−1","+3","+5"],"hk":["−3","−1","+3","+5"]},"answer":0,"explanation":{"en":"x + 4(+1) = +1, therefore x = −3.","zh":"x + 4×(+1) = +1，得 x = −3。","hk":"x + 4×(+1) = +1，得 x = −3。"}}],"mainlandBook":"c2","hkBook":"h12"},{"id":"rates","book":"c2","title":{"en":"Energy & reaction rates","zh":"化学反应与能量","hk":"化學反應與能量"},"points":{"en":["Exothermic reactions release energy to the surroundings; their enthalpy change ΔH is negative.","Reaction rate depends on conditions such as temperature, concentration and surface area.","A catalyst offers a different pathway with lower activation energy. It does not change the reaction enthalpy or equilibrium constant at fixed temperature."],"zh":["放热反应向环境释放能量，反应焓变 ΔH \u003c 0。","温度、浓度、接触面积等条件可以影响反应速率。","催化剂提供活化能较低的反应路径。在一定温度下，不改变反应焓变和平衡常数。"],"hk":["放熱反應向環境釋放能量，反應焓變 ΔH \u003c 0。","温度、濃度、接觸面積等條件可以影響反應速率。","催化劑提供活化能較低的反應路徑。在一定温度下，不改變反應焓變和平衡常數。"]},"example":{"en":"Powdered calcium carbonate usually reacts faster with dilute acid than equal-mass chips under otherwise identical conditions, because it exposes more surface.","zh":"其他条件相同时，等质量碳酸钙粉末通常比块状碳酸钙与稀酸反应更快，因为接触面积更大。","hk":"其他條件相同時，等質量碳酸鈣粉末通常比塊狀碳酸鈣與稀酸反應更快，因為接觸面積更大。"},"pitfall":{"en":"Faster reaction does not necessarily mean more final product. Rate and equilibrium yield are different ideas.","zh":"反应更快不代表最终产物更多。反应速率与平衡产率是不同概念。","hk":"反應更快不代表最終產物更多。反應速率與平衡產率是不同概念。"},"questions":[{"id":"rates-0","prompt":{"en":"Which quantity does a catalyst lower?","zh":"催化剂降低的是？","hk":"催化劑降低的是？"},"options":{"en":["Activation energy","Product mass in every case","Reaction enthalpy","Equilibrium constant"],"zh":["活化能","所有反应中的产物质量","反应焓变","平衡常数"],"hk":["活化能","所有反應中的產物質量","反應焓變","平衡常數"]},"answer":0,"explanation":{"en":"A catalyst lowers the activation barrier through an alternative pathway.","zh":"催化剂通过改变反应路径降低活化能。","hk":"催化劑通過改變反應路徑降低活化能。"}},{"id":"rates-1","prompt":{"en":"An exothermic reaction has…","zh":"放热反应的焓变满足……","hk":"放熱反應的焓變滿足……"},"options":{"en":["ΔH > 0","ΔH = 0 always","ΔH \u003c 0","No energy change"],"zh":["ΔH > 0","ΔH 总为 0","ΔH \u003c 0","没有能量变化"],"hk":["ΔH > 0","ΔH 總為 0","ΔH \u003c 0","沒有能量變化"]},"answer":2,"explanation":{"en":"The system releases heat at constant pressure, so ΔH is negative.","zh":"恒压条件下体系放热，焓变为负。","hk":"恆壓條件下體系放熱，焓變為負。"}}],"mainlandBook":"c2","hkBook":"h9"},{"id":"organic","book":"c2","title":{"en":"Organic chemistry essentials","zh":"有机化合物入门","hk":"有機化合物入門"},"points":{"en":["Carbon commonly forms four covalent bonds. Hydrocarbons contain only carbon and hydrogen.","Alkanes are saturated; an acyclic alkane has formula CₙH₂ₙ₊₂.","An alkene contains a C=C double bond and can undergo addition reactions."],"zh":["碳原子通常形成四个共价键。烃只含碳、氢两种元素。","烷烃为饱和链烃，通式为 CₙH₂ₙ₊₂。","烯烃含碳碳双键，可以发生加成反应。"],"hk":["碳原子通常形成四個共價鍵。烴只含碳、氫兩種元素。","烷烴為飽和鏈烴，通式為 CₙH₂ₙ₊₂。","烯烴含碳碳雙鍵，可以發生加成反應。"]},"example":{"en":"Ethene reacts with bromine by addition: CH₂=CH₂ + Br₂ → CH₂Br–CH₂Br. Bromine colour fades under suitable test conditions.","zh":"乙烯与溴发生加成反应：CH₂=CH₂ + Br₂ → CH₂Br–CH₂Br。在适当条件下可观察到溴的颜色褪去。","hk":"乙烯與溴發生加成反應：CH₂=CH₂ + Br₂ → CH₂Br–CH₂Br。在適當條件下可觀察到溴的顏色褪去。"},"pitfall":{"en":"A molecular formula alone may not identify one compound: structural isomers can share the same formula.","zh":"分子式相同不代表结构相同；同分异构体可具有相同分子式。","hk":"分子式相同不代表結構相同；同分異構體可具有相同分子式。"},"questions":[{"id":"organic-0","prompt":{"en":"Which is an alkane?","zh":"下列属于烷烃的是？","hk":"下列屬於烷烴的是？"},"options":{"en":["C₂H₄","C₂H₂","C₂H₆","C₂H₅OH"],"zh":["C₂H₄","C₂H₂","C₂H₆","C₂H₅OH"],"hk":["C₂H₄","C₂H₂","C₂H₆","C₂H₅OH"]},"answer":2,"explanation":{"en":"Ethane C₂H₆ fits the acyclic alkane formula CₙH₂ₙ₊₂.","zh":"乙烷 C₂H₆ 符合链状烷烃的通式 CₙH₂ₙ₊₂。","hk":"乙烷 C₂H₆ 符合鏈狀烷烴的通式 CₙH₂ₙ₊₂。"}},{"id":"organic-1","prompt":{"en":"Ethene reacts with bromine mainly by…","zh":"乙烯与溴发生的主要反应类型是？","hk":"乙烯與溴發生的主要反應類型是？"},"options":{"en":["Addition","Neutralisation","Precipitation","Esterification"],"zh":["加成反应","中和反应","沉淀反应","酯化反应"],"hk":["加成反應","中和反應","沉澱反應","酯化反應"]},"answer":0,"explanation":{"en":"Atoms add across the carbon–carbon double bond.","zh":"溴原子加到碳碳双键两端，生成加成产物。","hk":"溴原子加到碳碳雙鍵兩端，生成加成產物。"}}],"mainlandBook":"c2","hkBook":"h7"},{"id":"environment","book":"c2","title":{"en":"Chemistry, resources & environment","zh":"化学与可持续发展","hk":"化學與可持續發展"},"points":{"en":["Atom economy compares the formula mass of desired product with the total formula masses of reactants in a balanced equation, including coefficients.","High yield and high atom economy measure different things.","Resource efficiency includes raw materials, energy, waste and recycling; assess the whole process."],"zh":["原子利用率依据配平反应式，比较目标产物与全部反应物的相对分子质量总和，需计入系数。","产率与原子利用率衡量不同方面，不能混同。","资源利用应综合考虑原料、能耗、废物和回收等整个过程。"],"hk":["原子利用率依據配平反應式，比較目標產物與全部反應物的相對分子質量總和，需計入係數。","產率與原子利用率衡量不同方面，不能混同。","資源利用應綜合考慮原料、能耗、廢物和回收等整個過程。"]},"example":{"en":"For CaCO₃ → CaO + CO₂, taking relative formula masses 100, 56 and 44, atom economy for CaO is 56/100 × 100% = 56%.","zh":"CaCO₃ → CaO + CO₂，取相对分子质量依次为 100、56、44。以 CaO 为目标产物，原子利用率为 56%。","hk":"CaCO₃ → CaO + CO₂，取相對分子質量依次為 100、56、44。以 CaO 為目標產物，原子利用率為 56%。"},"pitfall":{"en":"A process with 100% yield can still generate substantial by-products.","zh":"产率达到 100% 的过程仍可能产生大量副产物。","hk":"產率達到 100% 的過程仍可能產生大量副產物。"},"questions":[{"id":"environment-0","prompt":{"en":"For CaCO₃ → CaO + CO₂, atom economy for CaO is approximately…","zh":"CaCO₃ → CaO + CO₂，以 CaO 为目标产物，原子利用率约为？","hk":"CaCO₃ → CaO + CO₂，以 CaO 為目標產物，原子利用率約為？"},"options":{"en":["44%","56%","100%","156%"],"zh":["44%","56%","100%","156%"],"hk":["44%","56%","100%","156%"]},"answer":1,"explanation":{"en":"56/100 × 100% = 56%.","zh":"56/100 × 100% = 56%。","hk":"56/100 × 100% = 56%。"}},{"id":"environment-1","prompt":{"en":"Which is evidence of better resource efficiency?","zh":"下列哪项可体现更好的资源利用？","hk":"下列哪項可體現更好的資源利用？"},"options":{"en":["More waste per kilogram of product","More energy for the same output","Recovering and reusing suitable solvents","Ignoring by-products"],"zh":["单位产物废物更多","相同产出消耗更多能源","回收并重复利用适当的溶剂","忽略副产物"],"hk":["單位產物廢物更多","相同產出消耗更多能源","回收並重複利用適當的溶劑","忽略副產物"]},"answer":2,"explanation":{"en":"Solvent recovery can reduce consumption and waste; the full process still needs assessment.","zh":"溶剂回收可减少消耗与废物，仍需结合完整过程评价。","hk":"溶劑回收可減少消耗與廢物，仍需結合完整過程評價。"}}],"mainlandBook":"c2","hkBook":"h1"},{"id":"equilibrium","book":"s1","title":{"en":"Chemical equilibrium","zh":"化学平衡","hk":"化學平衡"},"points":{"en":["At dynamic equilibrium in a closed system, forward and reverse reaction rates are equal; reactions continue.","Equilibrium concentrations remain constant but are not necessarily equal.","At fixed temperature, K is fixed for a given reaction. A catalyst speeds approach to equilibrium without shifting it."],"zh":["密闭体系达到动态平衡时，正、逆反应速率相等，反应仍在进行。","平衡时各组分浓度保持不变，但浓度不一定相等。","一定温度下，给定反应的平衡常数不变。催化剂加快达到平衡，不改变平衡位置。"],"hk":["密閉體系達到動態平衡時，正、逆反應速率相等，反應仍在進行。","平衡時各組分濃度保持不變，但濃度不一定相等。","一定温度下，給定反應的平衡常數不變。催化劑加快達到平衡，不改變平衡位置。"]},"example":{"en":"For N₂(g) + 3H₂(g) ⇌ 2NH₃(g), Kc = [NH₃]²/([N₂][H₂]³). Compression at fixed temperature favours the side with fewer gas molecules.","zh":"对 N₂(g) + 3H₂(g) ⇌ 2NH₃(g)，Kc = c²(NH₃)/[c(N₂)c³(H₂)]。恒温压缩容积有利于平衡向气体分子数减少的方向移动。","hk":"對 N₂(g) + 3H₂(g) ⇌ 2NH₃(g)，Kc = c²(NH₃)/[c(N₂)c³(H₂)]。恆温壓縮容積有利於平衡向氣體分子數減少的方向移動。"},"pitfall":{"en":"Equilibrium does not mean the reaction has stopped. Adding a catalyst does not increase the equilibrium yield.","zh":"平衡不代表反应停止。加入催化剂不会提高平衡产率。","hk":"平衡不代表反應停止。加入催化劑不會提高平衡產率。"},"questions":[{"id":"equilibrium-0","prompt":{"en":"At equilibrium, the forward reaction rate is…","zh":"达到化学平衡时，正反应速率……","hk":"達到化學平衡時，正反應速率……"},"options":{"en":["Zero","Equal to the reverse rate","Always greater than the reverse rate","Unrelated to the reverse rate"],"zh":["为零","等于逆反应速率","总大于逆反应速率","与逆反应速率无关"],"hk":["為零","等於逆反應速率","總大於逆反應速率","與逆反應速率無關"]},"answer":1,"explanation":{"en":"Both reactions continue at equal rates.","zh":"正、逆反应仍在进行，且速率相等。","hk":"正、逆反應仍在進行，且速率相等。"}},{"id":"equilibrium-1","prompt":{"en":"For a fixed reaction, which change can change K?","zh":"对给定反应，哪项变化可以改变平衡常数？","hk":"對給定反應，哪項變化可以改變平衡常數？"},"options":{"en":["Adding a catalyst","Changing initial concentration only","Changing temperature","Changing container size at fixed temperature"],"zh":["加入催化剂","只改变初始浓度","改变温度","恒温改变容器体积"],"hk":["加入催化劑","只改變初始濃度","改變温度","恆温改變容器體積"]},"answer":2,"explanation":{"en":"K depends on temperature, not on the starting composition.","zh":"平衡常数与温度有关，与初始组成无关。","hk":"平衡常數與温度有關，與初始組成無關。"}}],"mainlandBook":"s1","hkBook":"h11"},{"id":"aqueous","book":"s1","title":{"en":"Acids, bases & aqueous equilibria","zh":"水溶液中的离子反应与平衡","hk":"水溶液中的離子反應與平衡"},"points":{"en":["pH = −log₁₀[H⁺] in the dilute-solution school approximation, with concentration in mol/L.","At 25 °C, Kw ≈ 1.0 × 10⁻¹⁴ and a neutral solution has pH ≈ 7.","Strong acids ionise essentially completely in dilute water; weak acids establish an ionisation equilibrium."],"zh":["在高中稀溶液近似中，pH = −lg c(H⁺)，浓度以 mol/L 表示。","25 ℃ 时，Kw ≈ 1.0 × 10⁻¹⁴，中性溶液的 pH 约为 7。","强酸在稀水溶液中基本完全电离，弱酸存在电离平衡。"],"hk":["在高中稀溶液近似中，pH = −lg c(H⁺)，濃度以 mol/L 表示。","25 ℃ 時，Kw ≈ 1.0 × 10⁻¹⁴，中性溶液的 pH 約為 7。","強酸在稀水溶液中基本完全電離，弱酸存在電離平衡。"]},"example":{"en":"For 0.010 mol/L HCl at 25 °C, neglecting water autoionisation, [H⁺] ≈ 10⁻² mol/L, so pH ≈ 2.","zh":"25 ℃ 时，0.010 mol/L HCl 溶液忽略水的电离，c(H⁺) ≈ 10⁻² mol/L，pH ≈ 2。","hk":"25 ℃ 時，0.010 mol/L HCl 溶液忽略水的電離，c(H⁺) ≈ 10⁻² mol/L，pH ≈ 2。"},"pitfall":{"en":"Acid strength is not concentration. A dilute strong acid is still a strong acid.","zh":"酸的强弱与浓度不同。稀的强酸仍属于强酸。","hk":"酸的強弱與濃度不同。稀的強酸仍屬於強酸。"},"questions":[{"id":"aqueous-0","prompt":{"en":"What is the approximate pH of 0.001 mol/L HCl at 25 °C?","zh":"25 ℃ 时，0.001 mol/L HCl 的 pH 近似为？","hk":"25 ℃ 時，0.001 mol/L HCl 的 pH 近似為？"},"options":{"en":["1","2","3","11"],"zh":["1","2","3","11"],"hk":["1","2","3","11"]},"answer":2,"explanation":{"en":"pH = −log₁₀(10⁻³) = 3.","zh":"pH = −lg(10⁻³) = 3。","hk":"pH = −lg(10⁻³) = 3。"}},{"id":"aqueous-1","prompt":{"en":"At 25 °C, a neutral aqueous solution has…","zh":"25 ℃ 时，中性水溶液满足……","hk":"25 ℃ 時，中性水溶液滿足……"},"options":{"en":["[H⁺] > [OH⁻]","[H⁺] = [OH⁻]","[H⁺] = 0","[OH⁻] = 0"],"zh":["c(H⁺) > c(OH⁻)","c(H⁺) = c(OH⁻)","c(H⁺) = 0","c(OH⁻) = 0"],"hk":["c(H⁺) > c(OH⁻)","c(H⁺) = c(OH⁻)","c(H⁺) = 0","c(OH⁻) = 0"]},"answer":1,"explanation":{"en":"Neutrality means equal hydrogen- and hydroxide-ion concentrations.","zh":"中性表示氢离子与氢氧根离子浓度相等。","hk":"中性表示氫離子與氫氧根離子濃度相等。"}}],"mainlandBook":"s1","hkBook":"h4"},{"id":"electrons","book":"s2","title":{"en":"Electron arrangements","zh":"原子结构与电子排布","hk":"原子結構與電子排布"},"points":{"en":["Electrons occupy orbitals. An orbital can hold at most two electrons with opposite spins.","Ground-state electron arrangements follow energy ordering, Pauli exclusion and Hund's rule.","For the first 20 elements, simple shell arrangements help explain common ion formation and periodic trends."],"zh":["电子占据原子轨道，每个轨道最多容纳两个自旋方向相反的电子。","基态电子排布遵循能量最低原理、泡利原理和洪特规则。","前 20 号元素的电子层排布可帮助理解常见离子的形成和周期性变化。"],"hk":["電子佔據原子軌道，每個軌道最多容納兩個自旋方向相反的電子。","基態電子排布遵循能量最低原理、泡利原理和洪特規則。","前 20 號元素的電子層排列可幫助理解常見離子的形成和週期性變化。"]},"example":{"en":"Sodium has shell arrangement 2,8,1 and commonly loses one outer electron to form Na⁺ with arrangement 2,8.","zh":"钠原子电子层排布为 2、8、1，常失去最外层的一个电子，形成排布为 2、8 的 Na⁺。","hk":"鈉原子電子層排列為 2、8、1，常失去最外層的一個電子，形成排布為 2、8 的 Na⁺。"},"pitfall":{"en":"Shell diagrams are a model. Electrons do not travel on literal circular tracks like planets.","zh":"电子层示意图是一种模型，不能将电子理解为沿固定圆形轨道运行的小行星。","hk":"電子層示意圖是一種模型，不能將電子理解為沿固定圓形軌道運行的小行星。"},"questions":[{"id":"electrons-0","prompt":{"en":"An orbital holds at most how many electrons?","zh":"一个原子轨道最多容纳多少个电子？","hk":"一個原子軌道最多容納多少個電子？"},"options":{"en":["1","2","8","18"],"zh":["1","2","8","18"],"hk":["1","2","8","18"]},"answer":1,"explanation":{"en":"The Pauli exclusion principle allows two electrons of opposite spin per orbital.","zh":"根据泡利原理，每个轨道最多容纳两个自旋方向相反的电子。","hk":"根據泡利原理，每個軌道最多容納兩個自旋方向相反的電子。"}},{"id":"electrons-1","prompt":{"en":"The shell arrangement of a neutral Na atom is…","zh":"中性钠原子的电子层排布是？","hk":"中性鈉原子的電子層排列是？"},"options":{"en":["2,8","2,8,1","2,7,2","2,8,2"],"zh":["2、8","2、8、1","2、7、2","2、8、2"],"hk":["2、8","2、8、1","2、7、2","2、8、2"]},"answer":1,"explanation":{"en":"Na has 11 electrons: 2 + 8 + 1.","zh":"钠有 11 个电子，按 2、8、1 排列。","hk":"鈉有 11 個電子，按 2、8、1 排列。"}}],"mainlandBook":"s2","hkBook":"h6"},{"id":"bonding","book":"s2","title":{"en":"Bonding & molecular interactions","zh":"化学键与分子间作用力","hk":"化學鍵與分子間作用力"},"points":{"en":["Ionic bonding is electrostatic attraction between oppositely charged ions. Covalent bonding involves shared electron pairs.","Molecular shape depends on electron-pair arrangement, including lone pairs.","Intermolecular attractions are distinct from covalent bonds within molecules and influence boiling and melting."],"zh":["离子键是阴、阳离子之间的静电作用；共价键与原子间共用电子对有关。","分子空间结构与成键电子对和孤电子对的排布有关。","分子间作用力与分子内共价键不同，会影响物质的熔点和沸点。"],"hk":["離子鍵是陰、陽離子之間的靜電作用；共價鍵與原子間共用電子對有關。","分子空間結構與成鍵電子對和孤電子對的排布有關。","分子間作用力與分子內共價鍵不同，會影響物質的熔點和沸點。"]},"example":{"en":"Water is bent, not linear. Its O–H bonds are polar and their dipoles do not cancel, making the molecule polar.","zh":"水分子呈 V 形，O—H 键具有极性，键偶极不能相互抵消，因此水是极性分子。","hk":"水分子呈 V 形，O—H 鍵具有極性，鍵偶極不能相互抵消，因此水是極性分子。"},"pitfall":{"en":"A polar bond does not guarantee a polar molecule: the two bond dipoles cancel in linear CO₂.","zh":"含极性键的分子不一定是极性分子，如直线形 CO₂ 的键偶极相互抵消。","hk":"含極性鍵的分子不一定是極性分子，如直線形 CO₂ 的鍵偶極相互抵消。"},"questions":[{"id":"bonding-0","prompt":{"en":"Which molecule is nonpolar overall?","zh":"下列哪种分子整体为非极性？","hk":"下列哪種分子整體為非極性？"},"options":{"en":["H₂O","NH₃","CO₂","HCl"],"zh":["H₂O","NH₃","CO₂","HCl"],"hk":["H₂O","NH₃","CO₂","HCl"]},"answer":2,"explanation":{"en":"Linear symmetric CO₂ has polar bonds whose dipoles cancel.","zh":"CO₂ 为直线对称结构，两个极性键的偶极相互抵消。","hk":"CO₂ 為直線對稱結構，兩個極性鍵的偶極相互抵消。"}},{"id":"bonding-1","prompt":{"en":"Boiling liquid water mainly overcomes…","zh":"水沸腾时主要克服的是……","hk":"水沸騰時主要克服的是……"},"options":{"en":["O–H covalent bonds","Intermolecular attractions","Nuclear forces","Ionic bonds in H₂O"],"zh":["O—H 共价键","分子间作用力","核力","水分子中的离子键"],"hk":["O—H 共價鍵","分子間作用力","核力","水分子中的離子鍵"]},"answer":1,"explanation":{"en":"The molecules remain H₂O; intermolecular attractions are overcome.","zh":"水分子仍为 H₂O，主要克服分子间作用力。","hk":"水分子仍為 H₂O，主要克服分子間作用力。"}}],"mainlandBook":"s2","hkBook":"h2"},{"id":"isomers","book":"s3","title":{"en":"Hydrocarbons & isomerism","zh":"烃与同分异构现象","hk":"烴與同分異構現象"},"points":{"en":["Structural isomers have the same molecular formula but different atom connectivity.","Alkene reactions often involve the C=C bond. Aromatic compounds have different bonding and reactivity.","Name a compound from its structure; do not infer a unique structure from its formula alone."],"zh":["同分异构体具有相同的分子式，但原子连接方式不同。","烯烃的反应通常涉及碳碳双键，芳香烃的成键方式和反应性质有所不同。","应依据结构命名，不能只凭分子式判断唯一结构。"],"hk":["同分異構體具有相同的分子式，但原子連接方式不同。","烯烴的反應通常涉及碳碳雙鍵，芳香烴的成鍵方式和反應性質有所不同。","應依據結構命名，不能只憑分子式判斷唯一結構。"]},"example":{"en":"C₄H₁₀ has two structural isomers: butane CH₃CH₂CH₂CH₃ and 2-methylpropane (CH₃)₃CH.","zh":"C₄H₁₀ 有两种同分异构体：正丁烷 CH₃CH₂CH₂CH₃ 和异丁烷（2-甲基丙烷）(CH₃)₃CH。","hk":"C₄H₁₀ 有兩種同分異構體：正丁烷 CH₃CH₂CH₂CH₃ 和異丁烷（2-甲基丙烷）(CH₃)₃CH。"},"pitfall":{"en":"Rotating a single bond or redrawing the same connectivity does not create a structural isomer.","zh":"旋转单键或将同一连接方式重新绘制，不会产生新的构造异构体。","hk":"旋轉單鍵或將同一連接方式重新繪製，不會產生新的構造異構體。"},"questions":[{"id":"isomers-0","prompt":{"en":"How many structural isomers does C₄H₁₀ have?","zh":"C₄H₁₀ 有几种构造异构体？","hk":"C₄H₁₀ 有幾種構造異構體？"},"options":{"en":["1","2","3","4"],"zh":["1","2","3","4"],"hk":["1","2","3","4"]},"answer":1,"explanation":{"en":"Only the straight-chain and one branched structure are possible.","zh":"有直链的正丁烷和支链的异丁烷两种。","hk":"有直鏈的正丁烷和支鏈的異丁烷兩種。"}},{"id":"isomers-1","prompt":{"en":"Structural isomers share the same…","zh":"构造异构体一定具有相同的……","hk":"構造異構體一定具有相同的……"},"options":{"en":["Molecular formula","Connectivity","Boiling point","Chemical reactivity"],"zh":["分子式","原子连接方式","沸点","化学反应性"],"hk":["分子式","原子連接方式","沸點","化學反應性"]},"answer":0,"explanation":{"en":"The molecular formula is the same, but connectivity differs.","zh":"构造异构体分子式相同，原子连接方式不同。","hk":"構造異構體分子式相同，原子連接方式不同。"}}],"mainlandBook":"s3","hkBook":"h8"},{"id":"functional","book":"s3","title":{"en":"Oxygen-containing functional groups","zh":"烃的含氧衍生物","hk":"烴的含氧衍生物"},"points":{"en":["Functional groups help determine chemical properties: hydroxyl in alcohols, carboxyl in carboxylic acids, and ester linkage in esters.","Alcohols and carboxylic acids can undergo reversible esterification under suitable conditions.","Hydrolysis breaks an ester into related products; conditions affect reversibility and products."],"zh":["官能团影响有机物的化学性质，如醇中的羟基、羧酸中的羧基、酯中的酯基。","醇和羧酸在适当条件下可发生可逆的酯化反应。","酯可发生水解，不同条件下反应的可逆性和产物有所不同。"],"hk":["官能團影響有機物的化學性質，如醇中的羥基、羧酸中的羧基、酯中的酯基。","醇和羧酸在適當條件下可發生可逆的酯化反應。","酯可發生水解，不同條件下反應的可逆性和產物有所不同。"]},"example":{"en":"CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O. Ethanoic acid and ethanol form ethyl ethanoate and water with an acid catalyst and heating.","zh":"CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O。在酸催化、加热条件下，乙酸与乙醇生成乙酸乙酯和水。","hk":"CH₃COOH + C₂H₅OH ⇌ CH₃COOC₂H₅ + H₂O。在酸催化、加熱條件下，乙酸與乙醇生成乙酸乙酯和水。"},"pitfall":{"en":"Not every compound containing OH is an alcohol; phenols have OH bonded directly to an aromatic ring.","zh":"含有羟基的化合物不一定是醇，例如酚的羟基直接连在芳环上。","hk":"含有羥基的化合物不一定是醇，例如酚的羥基直接連在芳環上。"},"questions":[{"id":"functional-0","prompt":{"en":"Which is the carboxyl group?","zh":"羧基的表示是？","hk":"羧基的表示是？"},"options":{"en":["–OH","–CHO","–COOH","–NH₂"],"zh":["—OH","—CHO","—COOH","—NH₂"],"hk":["—OH","—CHO","—COOH","—NH₂"]},"answer":2,"explanation":{"en":"A carboxyl group is –COOH.","zh":"羧基为 —COOH。","hk":"羧基為 —COOH。"}},{"id":"functional-1","prompt":{"en":"Ethanoic acid + ethanol can form…","zh":"乙酸与乙醇在适当条件下可生成……","hk":"乙酸與乙醇在適當條件下可生成……"},"options":{"en":["Ethyl ethanoate and water","Methane and oxygen","Sodium chloride","Ethene only"],"zh":["乙酸乙酯和水","甲烷和氧气","氯化钠","只生成乙烯"],"hk":["乙酸乙酯和水","甲烷和氧氣","氯化鈉","只生成乙烯"]},"answer":0,"explanation":{"en":"This is esterification; water is also formed.","zh":"该反应为酯化反应，同时生成水。","hk":"該反應為酯化反應，同時生成水。"}}],"mainlandBook":"s3","hkBook":"h8"},{"id":"grammar","book":"eng","title":{"en":"Explain a process clearly","zh":"清晰描述过程","hk":"清晰描述過程"},"points":{"en":["Use the present simple for general scientific facts: Heat increases particle motion.","Use the passive when the process matters more than the person: The solution is heated.","Sequence steps with first, then and finally. Keep the procedure and the conclusion separate."],"zh":["一般科学事实常用一般现在时。","强调过程而非操作者时可使用被动语态。","使用 first、then、finally 描述顺序，将步骤与结论分开。"],"hk":["一般科學事實常用一般現在時。","強調過程而非操作者時可使用被動語態。","使用 first、then、finally 描述順序，將步驟與結論分開。"]},"example":{"en":"Active: We add the indicator. Passive: The indicator is added. The passive uses be + past participle.","zh":"主动语态：We add the indicator. 被动语态：The indicator is added。结构为 be + 过去分词。","hk":"主動語態：We add the indicator. 被動語態：The indicator is added。結構為 be + 過去分詞。"},"pitfall":{"en":"Do not use 'was increase'. Use 'increased' or 'was increased', depending on the intended meaning.","zh":"不要写 was increase，应根据含义使用 increased 或 was increased。","hk":"不要寫 was increase，應根據含義使用 increased 或 was increased。"},"questions":[{"id":"grammar-0","prompt":{"en":"Choose the correct passive sentence.","zh":"选择正确的被动句。","hk":"選擇正確的被動句。"},"options":{"en":["The solution heat.","The solution is heated.","The solution is heat.","The solution heated by."],"zh":["The solution heat.","The solution is heated.","The solution is heat.","The solution heated by."],"hk":["The solution heat.","The solution is heated.","The solution is heat.","The solution heated by."]},"answer":1,"explanation":{"en":"Present simple passive = is/are + past participle.","zh":"一般现在时被动语态为 is/are + 过去分词。","hk":"一般現在時被動語態為 is/are + 過去分詞。"}},{"id":"grammar-1","prompt":{"en":"Choose the best general scientific statement.","zh":"选择最合适的一般科学事实表述。","hk":"選擇最合適的一般科學事實表述。"},"options":{"en":["Water boil at standard pressure at 100 °C.","Water boiling at standard pressure at 100 °C.","Water boils at standard pressure at 100 °C.","Water are boils at standard pressure at 100 °C."],"zh":["Water boil at standard pressure at 100 °C.","Water boiling at standard pressure at 100 °C.","Water boils at standard pressure at 100 °C.","Water are boils at standard pressure at 100 °C."],"hk":["Water boil at standard pressure at 100 °C.","Water boiling at standard pressure at 100 °C.","Water boils at standard pressure at 100 °C.","Water are boils at standard pressure at 100 °C."]},"answer":2,"explanation":{"en":"The singular subject 'water' takes 'boils' in the present simple.","zh":"water 为单数概念，谓语用 boils。","hk":"water 為單數概念，謂語用 boils。"}}],"mainlandBook":"eng","hkBook":"eng"},{"id":"evidence","book":"eng","title":{"en":"Evidence & academic writing","zh":"证据与学术表达","hk":"證據與學術表達"},"points":{"en":["Separate observations from explanations: 'the temperature rose' is an observation; 'the reaction released heat' interprets it.","Use measured language such as suggests or is consistent with when evidence is limited.","Build an answer with a claim, evidence and reasoning. Explain how the evidence supports the claim."],"zh":["区分观察与解释：温度上升是观察，反应放热是解释。","证据有限时使用 suggests、is consistent with 等谨慎表达。","用观点、证据、推理组织答案，说明证据如何支持观点。"],"hk":["區分觀察與解釋：温度上升是觀察，反應放熱是解釋。","證據有限時使用 suggests、is consistent with 等謹慎表達。","用觀點、證據、推理組織答案，説明證據如何支持觀點。"]},"example":{"en":"Claim: Powder increases the rate. Evidence: The same gas volume formed in 30 s rather than 60 s. Reasoning: Greater surface area exposes more reactant particles.","zh":"观点：粉末加快反应。证据：产生相同体积气体所需时间从 60 s 降至 30 s。推理：接触面积增大，暴露的反应粒子更多。","hk":"觀點：粉末加快反應。證據：產生相同體積氣體所需時間從 60 s 降至 30 s。推理：接觸面積增大，暴露的反應粒子更多。"},"pitfall":{"en":"'This proves' is often too strong for one small experiment. Mention controlled variables and limitations.","zh":"单次小实验使用 This proves 往往过于绝对，应考虑控制变量和局限。","hk":"單次小實驗使用 This proves 往往過於絕對，應考慮控制變量和侷限。"},"questions":[{"id":"evidence-0","prompt":{"en":"Which statement is an observation?","zh":"哪项是观察结果？","hk":"哪項是觀察結果？"},"options":{"en":["The reaction is exothermic.","The temperature rose by 5 °C.","The particles collided more often.","The catalyst lowered activation energy."],"zh":["The reaction is exothermic.","The temperature rose by 5 °C.","The particles collided more often.","The catalyst lowered activation energy."],"hk":["The reaction is exothermic.","The temperature rose by 5 °C.","The particles collided more often.","The catalyst lowered activation energy."]},"answer":1,"explanation":{"en":"The temperature change is measured; the other statements interpret mechanisms or energy changes.","zh":"温度变化可以直接测量，其余涉及解释或机理。","hk":"温度變化可以直接測量，其餘涉及解釋或機理。"}},{"id":"evidence-1","prompt":{"en":"Which phrase best signals a cautious interpretation?","zh":"哪项最适合表达谨慎的解释？","hk":"哪項最適合表達謹慎的解釋？"},"options":{"en":["This always proves…","Everyone knows…","These results suggest…","There is no possible alternative…"],"zh":["This always proves…","Everyone knows…","These results suggest…","There is no possible alternative…"],"hk":["This always proves…","Everyone knows…","These results suggest…","There is no possible alternative…"]},"answer":2,"explanation":{"en":"'Suggest' connects evidence to an interpretation without overstating certainty.","zh":"suggest 连接证据与解释，同时避免过度断言。","hk":"suggest 連接證據與解釋，同時避免過度斷言。"}}],"mainlandBook":"eng","hkBook":"eng"},{"id":"reading","book":"eng","title":{"en":"Reading scientific English","zh":"科学英语阅读","hk":"科學英語閲讀"},"points":{"en":["Find the main claim before focusing on unfamiliar words.","Use context and word families: dissolve → solution; react → reaction → reactive.","Track logical connectors: because introduces a reason, whereas contrasts, and therefore introduces a consequence."],"zh":["先找主旨，再处理生词。","借助上下文与词族理解科学术语。","注意 because 表示原因，whereas 表示对比，therefore 表示结果。"],"hk":["先找主旨，再處理生詞。","藉助上下文與詞族理解科學術語。","注意 because 表示原因，whereas 表示對比，therefore 表示結果。"]},"example":{"en":"'The powder reacted faster because it had a larger surface area.' The main claim is faster reaction; the because-clause gives the explanation.","zh":"句子 The powder reacted faster because it had a larger surface area 中，主句是结果，because 从句解释原因。","hk":"句子 The powder reacted faster because it had a larger surface area 中，主句是結果，because 從句解釋原因。"},"pitfall":{"en":"'Whereas' contrasts two ideas; it does not normally introduce a cause.","zh":"whereas 用于对比两种情况，通常不表示原因。","hk":"whereas 用於對比兩種情況，通常不表示原因。"},"questions":[{"id":"reading-0","prompt":{"en":"Which connector introduces a consequence?","zh":"哪个连接词通常引出结果？","hk":"哪個連接詞通常引出結果？"},"options":{"en":["Whereas","Although","Therefore","Because"],"zh":["Whereas","Although","Therefore","Because"],"hk":["Whereas","Although","Therefore","Because"]},"answer":2,"explanation":{"en":"'Therefore' means 'as a result'.","zh":"therefore 表示因此、所以。","hk":"therefore 表示因此、所以。"}},{"id":"reading-1","prompt":{"en":"Read: 'The salt dissolved, forming a homogeneous solution.' What does homogeneous mean here?","zh":"阅读句子：The salt dissolved, forming a homogeneous solution。homogeneous 的含义是？","hk":"閲讀句子：The salt dissolved, forming a homogeneous solution。homogeneous 的含義是？"},"options":{"en":["Uniform throughout","Always coloured","Insoluble","Solid"],"zh":["Uniform throughout","Always coloured","Insoluble","Solid"],"hk":["Uniform throughout","Always coloured","Insoluble","Solid"]},"answer":0,"explanation":{"en":"A homogeneous solution has uniform composition on the scale considered.","zh":"homogeneous 表示均一的。","hk":"homogeneous 表示均一的。"}}],"mainlandBook":"eng","hkBook":"eng"},{"id":"hk-separation","book":"h1","hkBook":"h1","hkOnly":true,"title":{"en":"Sea-salt detective: separation","hk":"海鹽偵探：分離混合物","zh":"海鹽偵探：分離混合物"},"points":{"en":["Filtration separates an insoluble solid from a liquid.","Crystallisation recovers a dissolved solid; simple distillation collects a solvent.","Fractional distillation separates miscible liquids with different boiling points."],"hk":["過濾（filtration）分離不溶固體與液體。","結晶（crystallisation）取得溶質；簡單蒸餾（distillation）收集溶劑。","分餾利用不同沸點分離互溶液體。"],"zh":["過濾（filtration）分離不溶固體與液體。","結晶（crystallisation）取得溶質；簡單蒸餾（distillation）收集溶劑。","分餾利用不同沸點分離互溶液體。"]},"example":{"en":"To obtain pure water from salt water, collect the condensed vapour during distillation.","hk":"從鹽水取得純水：蒸餾後收集凝結的水蒸氣。","zh":"從鹽水取得純水：蒸餾後收集凝結的水蒸氣。"},"pitfall":{"en":"A filter does not remove dissolved salt.","hk":"濾紙不能除去已溶解的鹽。","zh":"濾紙不能除去已溶解的鹽。"},"questions":[{"id":"hk-separation-0","prompt":{"en":"Which method collects pure water from salt water?","hk":"哪個方法可從鹽水收集純水？","zh":"哪個方法可從鹽水收集純水？"},"options":{"en":["Filtration","Simple distillation","A magnet","Decanting"],"hk":["過濾","簡單蒸餾","磁鐵分離","傾析"],"zh":["過濾","簡單蒸餾","磁鐵分離","傾析"]},"answer":1,"explanation":{"en":"Water vaporises and condenses; the dissolved salt stays in the flask.","hk":"水汽化後凝結，已溶解的鹽留在燒瓶內。","zh":"水汽化後凝結，已溶解的鹽留在燒瓶內。"}}]},{"id":"hk-cells","book":"h5","hkBook":"h5","hkOnly":true,"title":{"en":"Power a gadget: cells and electrolysis","hk":"為小裝置供電：電池與電解","zh":"為小裝置供電：電池與電解"},"points":{"en":["Oxidation is electron loss; reduction is electron gain.","A chemical cell converts chemical energy into electrical energy.","Electrolysis uses electrical energy to drive a chemical change. Reduction occurs at the cathode and oxidation at the anode."],"hk":["氧化是失去電子；還原是得到電子。","化學電池（chemical cell）把化學能轉化為電能。","電解（electrolysis）利用電能促使化學變化。陰極發生還原，陽極發生氧化。"],"zh":["氧化是失去電子；還原是得到電子。","化學電池（chemical cell）把化學能轉化為電能。","電解（electrolysis）利用電能促使化學變化。陰極發生還原，陽極發生氧化。"]},"example":{"en":"In a zinc–copper cell, zinc loses electrons: Zn → Zn²⁺ + 2e⁻.","hk":"鋅銅電池中，鋅失去電子：Zn → Zn²⁺ + 2e⁻。","zh":"鋅銅電池中，鋅失去電子：Zn → Zn²⁺ + 2e⁻。"},"pitfall":{"en":"The cathode is not always negative: its sign differs between a chemical cell and an electrolytic cell.","hk":"陰極不一定帶負電：化學電池與電解池的電極符號不同。","zh":"陰極不一定帶負電：化學電池與電解池的電極符號不同。"},"questions":[{"id":"hk-cells-0","prompt":{"en":"Which process always occurs at the cathode?","hk":"陰極必定發生哪種反應？","zh":"陰極必定發生哪種反應？"},"options":{"en":["Oxidation","Reduction","Combustion","Neutralisation"],"hk":["氧化","還原","燃燒","中和"],"zh":["氧化","還原","燃燒","中和"]},"answer":1,"explanation":{"en":"Cathode means the electrode at which reduction occurs, in both types of cell.","hk":"不論化學電池或電解池，陰極都是發生還原的電極。","zh":"不論化學電池或電解池，陰極都是發生還原的電極。"}}]},{"id":"hk-rates","book":"h10","hkBook":"h10","hkOnly":true,"title":{"en":"Fizz race: why reactions speed up","hk":"氣泡競賽：反應為何加快？","zh":"氣泡競賽：反應為何加快？"},"points":{"en":["A reaction requires collisions with enough energy and suitable orientation.","Increasing temperature increases the fraction of collisions exceeding activation energy.","Greater surface area exposes more solid particles; compare rates while controlling other variables."],"hk":["反應需要能量足夠、方向合適的碰撞。","升溫令更多碰撞的能量達到活化能（activation energy）。","增大固體表面積可暴露更多粒子；比較速率時須控制其他變量。"],"zh":["反應需要能量足夠、方向合適的碰撞。","升溫令更多碰撞的能量達到活化能（activation energy）。","增大固體表面積可暴露更多粒子；比較速率時須控制其他變量。"]},"example":{"en":"Compare equal masses of marble chips and powder with the same acid volume and concentration; measure gas volume against time.","hk":"用相同質量的大理石粒與粉末，配合同體積、同濃度的酸，比較氣體體積隨時間的變化。","zh":"用相同質量的大理石粒與粉末，配合同體積、同濃度的酸，比較氣體體積隨時間的變化。"},"pitfall":{"en":"A faster reaction need not produce more gas in total when the limiting amount is unchanged.","hk":"若限制反應物的量相同，反應較快不代表最終氣體較多。","zh":"若限制反應物的量相同，反應較快不代表最終氣體較多。"},"questions":[{"id":"hk-rates-0","prompt":{"en":"With equal masses of excess marble and the same limiting acid, powder mainly gives…","hk":"相同質量且過量的大理石，配合同量限制反應物酸，粉末主要令……","zh":"相同質量且過量的大理石，配合同量限制反應物酸，粉末主要令……"},"options":{"en":["Less final gas","More final gas","The same final gas, sooner","No reaction"],"hk":["最終氣體較少","最終氣體較多","較快得到相同最終氣體量","不反應"],"zh":["最終氣體較少","最終氣體較多","較快得到相同最終氣體量","不反應"]},"answer":2,"explanation":{"en":"Surface area affects rate, while the same limiting acid fixes the final gas amount.","hk":"表面積影響速率；相同量的限制反應物酸決定最終氣體量。","zh":"表面積影響速率；相同量的限制反應物酸決定最終氣體量。"}}]},{"id":"hk-patterns","book":"h12","hkBook":"h12","hkOnly":true,"title":{"en":"Spot the pattern: groups and periods","hk":"找規律：族與週期","zh":"找規律：族與週期"},"points":{"en":["Elements in the same group have related outer-shell electron arrangements.","Across Period 3, metallic character generally decreases.","Group 17 elements form halide ions by gaining one electron; a more reactive halogen displaces a less reactive one from its halide solution."],"hk":["同族元素有相關的最外層電子排列。","沿第三週期由左至右，金屬性一般減弱。","第 17 族元素得到一個電子形成鹵離子；較活潑鹵素可從較不活潑鹵素的鹵化物溶液置換該鹵素。"],"zh":["同族元素有相關的最外層電子排列。","沿第三週期由左至右，金屬性一般減弱。","第 17 族元素得到一個電子形成鹵離子；較活潑鹵素可從較不活潑鹵素的鹵化物溶液置換該鹵素。"]},"example":{"en":"Cl₂ + 2Br⁻ → 2Cl⁻ + Br₂ demonstrates a halogen displacement.","hk":"Cl₂ + 2Br⁻ → 2Cl⁻ + Br₂ 是鹵素置換反應。","zh":"Cl₂ + 2Br⁻ → 2Cl⁻ + Br₂ 是鹵素置換反應。"},"pitfall":{"en":"Do not describe trends only by memorised arrows; relate them to electron arrangement and attraction.","hk":"不要只背趨勢箭嘴；要連繫電子排列及吸引力。","zh":"不要只背趨勢箭嘴；要連繫電子排列及吸引力。"},"questions":[{"id":"hk-patterns-0","prompt":{"en":"Which ion does chlorine normally form?","hk":"氯通常形成哪種離子？","zh":"氯通常形成哪種離子？"},"options":{"en":["Cl⁺","Cl²⁺","Cl⁻","Cl²⁻"],"hk":["Cl⁺","Cl²⁺","Cl⁻","Cl²⁻"],"zh":["Cl⁺","Cl²⁺","Cl⁻","Cl²⁻"]},"answer":2,"explanation":{"en":"A chlorine atom gains one electron to complete its outer shell.","hk":"氯原子得到一個電子，令最外層達到穩定排列。","zh":"氯原子得到一個電子，令最外層達到穩定排列。"}}]},{"id":"hk-industrial","book":"he1","hkBook":"he1","hkOnly":true,"title":{"en":"Factory choices: the Haber process","hk":"工廠抉擇：哈柏法","zh":"工廠抉擇：哈柏法"},"points":{"en":["The Haber process forms ammonia: N₂ + 3H₂ ⇌ 2NH₃.","For this exothermic reaction, lower temperature favours equilibrium ammonia yield, but slows reaction.","Industry balances rate, yield, energy cost and safety; a catalyst speeds approach to equilibrium without changing its position."],"hk":["哈柏法（Haber process）：N₂ + 3H₂ ⇌ 2NH₃。","此反應放熱；較低溫度有利平衡時的氨產率，但反應較慢。","工業條件須平衡速率、產率、能源成本及安全；催化劑加快達至平衡，不改變平衡位置。"],"zh":["哈柏法（Haber process）：N₂ + 3H₂ ⇌ 2NH₃。","此反應放熱；較低溫度有利平衡時的氨產率，但反應較慢。","工業條件須平衡速率、產率、能源成本及安全；催化劑加快達至平衡，不改變平衡位置。"]},"example":{"en":"Higher pressure favours the side with fewer gas molecules: ammonia.","hk":"提高壓強有利氣體分子較少的一方，即氨。","zh":"提高壓強有利氣體分子較少的一方，即氨。"},"pitfall":{"en":"A catalyst does not increase the equilibrium yield.","hk":"催化劑不會增加平衡產率。","zh":"催化劑不會增加平衡產率。"},"questions":[{"id":"hk-industrial-0","prompt":{"en":"Which change increases equilibrium ammonia yield at fixed temperature?","hk":"固定溫度下，哪項改變增加平衡氨產率？","zh":"固定溫度下，哪項改變增加平衡氨產率？"},"options":{"en":["Add a catalyst","Increase pressure","Increase vessel volume","Remove nitrogen"],"hk":["加入催化劑","提高壓強","增大容器體積","移走氮氣"],"zh":["加入催化劑","提高壓強","增大容器體積","移走氮氣"]},"answer":1,"explanation":{"en":"The product side has fewer moles of gas, so higher pressure favours it.","hk":"生成物一方的氣體摩爾數較少，提高壓強有利該方。","zh":"生成物一方的氣體摩爾數較少，提高壓強有利該方。"}}]},{"id":"hk-materials","book":"he2","hkBook":"he2","hkOnly":true,"title":{"en":"Choose a material: polymers","hk":"揀物料：聚合物","zh":"揀物料：聚合物"},"points":{"en":["Polymers are large molecules built from repeating units.","Addition polymerisation joins alkene monomers without eliminating a small molecule.","Material choices depend on structure, properties, useful lifetime and disposal."],"hk":["聚合物（polymer）是由重複單元組成的大分子。","加成聚合把烯烴單體連接，沒有小分子被消去。","選擇物料要考慮結構、性質、使用壽命及棄置方法。"],"zh":["聚合物（polymer）是由重複單元組成的大分子。","加成聚合把烯烴單體連接，沒有小分子被消去。","選擇物料要考慮結構、性質、使用壽命及棄置方法。"]},"example":{"en":"Ethene forms poly(ethene); its C=C bonds become C–C bonds along the chain.","hk":"乙烯形成聚乙烯；C=C 轉為鏈中的 C–C 鍵。","zh":"乙烯形成聚乙烯；C=C 轉為鏈中的 C–C 鍵。"},"pitfall":{"en":"The repeat unit is not an unchanged drawing of the alkene monomer.","hk":"重複單元並不是原封不動的烯烴單體。","zh":"重複單元並不是原封不動的烯烴單體。"},"questions":[{"id":"hk-materials-0","prompt":{"en":"Which monomer forms poly(ethene)?","hk":"聚乙烯由哪種單體形成？","zh":"聚乙烯由哪種單體形成？"},"options":{"en":["Ethene","Ethanol","Ethanoic acid","Methane"],"hk":["乙烯","乙醇","乙酸","甲烷"],"zh":["乙烯","乙醇","乙酸","甲烷"]},"answer":0,"explanation":{"en":"Ethene molecules join by addition polymerisation.","hk":"乙烯分子透過加成聚合連接。","zh":"乙烯分子透過加成聚合連接。"}}]},{"id":"hk-analysis","book":"he3","hkBook":"he3","hkOnly":true,"title":{"en":"Mystery ink: chromatography","hk":"神秘墨水：色譜法","zh":"神秘墨水：色譜法"},"points":{"en":["Chromatography separates components by their different interactions with stationary and mobile phases.","Rf = distance moved by the spot / distance moved by the solvent front, measured from the baseline.","Compare samples under the same conditions; one matching Rf alone does not prove identity."],"hk":["色譜法（chromatography）利用成分與固定相及流動相的不同作用分離混合物。","Rf = 色斑移動距離 ÷ 溶劑前沿移動距離，均由起始線量度。","須在相同條件下比較；只有相同 Rf 並不能證明是同一物質。"],"zh":["色譜法（chromatography）利用成分與固定相及流動相的不同作用分離混合物。","Rf = 色斑移動距離 ÷ 溶劑前沿移動距離，均由起始線量度。","須在相同條件下比較；只有相同 Rf 並不能證明是同一物質。"]},"example":{"en":"A spot moves 3.0 cm while the solvent front moves 6.0 cm: Rf = 0.50.","hk":"色斑移動 3.0 cm，溶劑前沿移動 6.0 cm：Rf = 0.50。","zh":"色斑移動 3.0 cm，溶劑前沿移動 6.0 cm：Rf = 0.50。"},"pitfall":{"en":"Rf has no unit; keep the initial spots above the solvent level.","hk":"Rf 沒有單位；起始色斑須高於溶劑液面。","zh":"Rf 沒有單位；起始色斑須高於溶劑液面。"},"questions":[{"id":"hk-analysis-0","prompt":{"en":"A spot moves 2 cm and the solvent front moves 5 cm. What is Rf?","hk":"色斑移動 2 cm，溶劑前沿移動 5 cm，Rf 是多少？","zh":"色斑移動 2 cm，溶劑前沿移動 5 cm，Rf 是多少？"},"options":{"en":["0.4","2.5","3 cm","10 cm²"],"hk":["0.4","2.5","3 cm","10 cm²"],"zh":["0.4","2.5","3 cm","10 cm²"]},"answer":0,"explanation":{"en":"Rf = 2/5 = 0.4, with no unit.","hk":"Rf = 2/5 = 0.4，沒有單位。","zh":"Rf = 2/5 = 0.4，沒有單位。"}}]}],"UI":{"en":{"lang":"en","brand":"CHEMHOUSE","strap":"A little curiosity. A lot of discovery.","dashboard":"Overview","learn":"Learning library","practice":"Practice room","tools":"Chemistry toolkit","notes":"Study notebook","edition":"Study edition","eng":"English edition","cn":"人教版 · 简体中文","crumb":"Your space to understand more","local":"Your study space","localDesc":"Notes and progress stay in this browser. No account needed.","greeting":"MAKE ROOM FOR A LITTLE DISCOVERY","hero":"Small steps.\u003cbr>Big reactions.","intro":"Explore everyday chemistry and HKDSE topics with short lessons and playful challenges. English explanations come with optional Traditional Chinese support.","start":"Start learning","quiz":"Try a quick quiz","art":"Curiosity is the catalyst.","artStrong":"Let's find your next reaction.","lessons":"Lessons explored","answered":"Questions answered","accuracy":"Latest-answer accuracy","unique":"Distinct questions","starter":"HKDSE topic starters","open":"Open library","paths":"Choose your next discovery","pathDesc":"Short explanations. Worked examples. A question to make it click.","continue":"Explore lessons","progress":"explored","tipTitle":"A formula is only the beginning.","tipDesc":"Turn m
